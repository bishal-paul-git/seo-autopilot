# Deploys the hosted SEO God (cloud/worker) to Cloudflare. Manual only: Actions -> deploy-seo-god -> Run workflow.
# By default it deploys what wrangler.toml says, which is PAUSED (SEO_GOD_PAUSED = "true"). A deploy replaces any value
# set in the Cloudflare dashboard, so a running scheduler would be paused by a routine redeploy: tick "run" to deploy it
# running instead. The database switch (public.set_god_paused) still pauses it either way.
#
# Repository secrets it needs (Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN        a Cloudflare API token with "Workers Scripts: Edit" on your account
#   CLOUDFLARE_ACCOUNT_ID       your Cloudflare account id
#   SUPABASE_SERVICE_ROLE_KEY   Supabase Dashboard -> Project Settings -> API keys -> service_role (secret)
# The scan secret is NOT needed here: the Worker reads it from Supabase Vault at run time (D40). The internal token
# that guards the Worker's own routes is generated on each deploy and never leaves Cloudflare.
name: deploy-seo-god
on:
  workflow_dispatch:
    inputs:
      run:
        description: "Deploy it running (SEO_GOD_PAUSED=false). Leave unticked to deploy paused."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-seo-god
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the secrets are set (names only)
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SRK" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi
      - name: Install the pinned wrangler
        run: npm ci
      - name: Refuse a wrangler.toml that is not paused by default
        run: grep -q '^SEO_GOD_PAUSED = "true"' wrangler.toml || { echo "::error::wrangler.toml must say SEO_GOD_PAUSED = \"true\""; exit 1; }
      - name: Deploy (paused unless "run" was ticked)
        run: |
          if [ "${{ inputs.run }}" = "true" ]; then npx wrangler deploy --var SEO_GOD_PAUSED:false
          else npx wrangler deploy; fi
      - name: Set the Worker's secrets (values never printed)
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          printf '%s' "$SRK" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put INTERNAL_TOKEN
      - name: Health check
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).result?.subdomain||""))')
          [ -n "$sub" ] || { echo "::warning::no workers.dev subdomain on this account; skipped the health check"; exit 0; }
          for i in 1 2 3 4 5 6; do curl -fsS "https://seo-god.$sub.workers.dev/health" && exit 0; sleep 10; done
          echo "::error::the Worker did not answer /health"; exit 1
