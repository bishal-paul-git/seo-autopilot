name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm test
      - name: CLI smoke test (init, help)
        run: |
          node bin/seo-autopilot.mjs help
          d=$(mktemp -d) && cd "$d" && git init -q && node "$GITHUB_WORKSPACE/bin/seo-autopilot.mjs" init --url https://example.com/ && test -f seo-autopilot.config.json
