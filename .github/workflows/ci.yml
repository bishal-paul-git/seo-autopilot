name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/setup-go@v7
        with: { go-version: "1.22" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Go engine (vet, tests, build)
        working-directory: engines/go
        run: |
          go vet ./...
          go test ./...
          go build -o /tmp/seo-crawl .
      - name: Python engine (tests, including the agent runtime with a scripted model)
        working-directory: engines/python
        run: |
          python -m pip install --quiet claude-agent-sdk
          python -m unittest discover -s tests -v
      - name: Node tests (the Go and Python integration tests run because both are installed here)
        run: npm test
      - name: CLI smoke test (init, help, upgrade, doctor)
        run: |
          node bin/seo-autopilot.mjs help
          d=$(mktemp -d) && cd "$d" && git init -q && node "$GITHUB_WORKSPACE/bin/seo-autopilot.mjs" init --url https://example.com/ && test -f seo-autopilot.config.json
          node "$GITHUB_WORKSPACE/bin/seo-autopilot.mjs" upgrade | tail -3
