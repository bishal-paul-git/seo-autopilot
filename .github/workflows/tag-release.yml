# Releases the version on main without a computer: Actions > tag-release > Run workflow.
# Checks that the version matches package.json on main, runs the tests, tags main as vX.Y.Z, moves v2 (and v2-stable when
# ticked) to it, and creates the GitHub Release from the matching CHANGELOG.md section. It creates the release itself
# because tags pushed with the workflow token do not start other workflows (so release.yml would not run).
name: tag-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v2.16.0 (must match package.json on main)"
        required: true
      stable:
        description: "Also move v2-stable to this release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      STABLE: ${{ inputs.stable }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Check the version
        run: |
          case "$VERSION" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Version must look like v2.16.0"; exit 1 ;; esac
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$VERSION" ] || { echo "package.json on main says $pkg, not $VERSION"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then echo "$VERSION already exists"; exit 1; fi
      - run: npm test
      - name: Tag main and move v2
        run: |
          git tag "$VERSION"
          git tag -f v2
          git push origin "$VERSION"
          git push -f origin v2
          if [ "$STABLE" = "true" ]; then git tag -f v2-stable && git push -f origin v2-stable; fi
      - name: Release notes from CHANGELOG.md
        run: |
          version="${VERSION#v}"
          awk -v v="$version" '$0 ~ "^## " v "$" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for $version." > notes.md; fi
      - name: Create the release
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag
