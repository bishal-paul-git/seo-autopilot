# Publishes the landing site (site/) to GitHub Pages. It stays dormant until Pages is switched on for this repository
# (Settings > Pages > Source: GitHub Actions). The demo page is built from sample data only.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "agents/**", "knowledge/**", "scripts/**", "src/audit/rules.mjs", "src/dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
