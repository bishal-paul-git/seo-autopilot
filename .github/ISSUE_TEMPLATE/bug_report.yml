name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste secrets, key files or private Search Console data. For a security problem use a private advisory instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx github:bishal-paul-git/seo-autopilot#v2 version`, or the tag your workflows use.
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [GitHub Actions, My computer (CLI), Local app (ui), Landing site or docs]
    validations: { required: true }
  - type: input
    id: job
    attributes:
      label: Which job or command?
      placeholder: "daily, audit, geo, upgrade, ..."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste the error lines. Remove anything private.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Config (optional)
      description: The `content` section of seo-autopilot.config.json, with private values removed.
      render: json
