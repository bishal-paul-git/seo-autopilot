# seo-autopilot: weekly job. Keyword research from your Search Console data, the analytics digest, and the
# "backlinks to do by hand" checklist. Opens GitHub issues; changes nothing on your site.
name: seo-weekly
on:
  schedule: [{ cron: "10 6 * * 1" }]   # Mondays 06:10 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: seo-data
  cancel-in-progress: false
env:
  SEO: "{{SPEC}}"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Restore state
        run: npx --yes "$SEO" state restore
      - name: Keyword research and topic proposals
        continue-on-error: true
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEO_INGEST_URL: ${{ secrets.SEO_INGEST_URL }}
          SEO_INGEST_TOKEN: ${{ secrets.SEO_INGEST_TOKEN }}
        run: npx --yes "$SEO" run research
      - name: Site profile (platform, rendering, edit or advise mode)
        continue-on-error: true
        run: npx --yes "$SEO" run profile
      - name: AI search readiness (GEO/AEO)
        continue-on-error: true
        run: npx --yes "$SEO" run geo
      - name: Page speed and Core Web Vitals
        continue-on-error: true
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: npx --yes "$SEO" run speed
      - name: Refresh proposals for pages losing visibility
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx --yes "$SEO" run refresh
      - name: Ranked priorities (weekly issue)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx --yes "$SEO" run priorities
      - name: Redirect map check and live redirect smoke test (skip cleanly without a redirect map)
        continue-on-error: true
        run: |
          npx --yes "$SEO" run redirects
          npx --yes "$SEO" run redirects smoke
      - name: GA4 conversions (events received, key events; skips without ga4PropertyId)
        continue-on-error: true
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
        run: npx --yes "$SEO" run conversions
      - name: Facts guard (numbers, prices, awards and client claims need a verified fact or a source)
        continue-on-error: true
        run: npx --yes "$SEO" run facts
      - name: Rendered vs delivered HTML (optional, OFF until the repository variable SEO_RENDER is true; installs a headless browser)
        if: vars.SEO_RENDER == 'true'
        continue-on-error: true
        run: |
          npm i --no-save playwright && npx playwright install --with-deps chromium
          npx --yes "$SEO" run render
      - name: Internal links to add for weakly linked pages (report only)
        continue-on-error: true
        run: npx --yes "$SEO" run links
      - name: Inbound links from your Search Console export (only if you saved one in seo-autopilot/inbound-links)
        continue-on-error: true
        run: npx --yes "$SEO" run inbound
      - name: On-page quality (top query vs title, H1 and description; headings per section)
        continue-on-error: true
        run: npx --yes "$SEO" run quality
      - name: Consent and measurement check
        continue-on-error: true
        run: npx --yes "$SEO" run consent
      - name: Sensitive-topic review gate
        continue-on-error: true
        run: npx --yes "$SEO" run ymyl
      - name: Content pace (report only)
        continue-on-error: true
        run: npx --yes "$SEO" run pace
      - name: Citations in search and AI answers (needs one provider key; skips cleanly without)
        continue-on-error: true
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: npx --yes "$SEO" run citations
      - name: Keyword explorer from your Search Console queries (adds Bing and DataForSEO when their keys are set)
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENPAGERANK_API_KEY: ${{ secrets.OPENPAGERANK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npx --yes "$SEO" run keywords
      - name: Live rank check (search features, competitors, share of voice; uses SERP credits, ON when SEO_RANK_LIVE is true)
        if: vars.SEO_RANK_LIVE == 'true'
        continue-on-error: true
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENPAGERANK_API_KEY: ${{ secrets.OPENPAGERANK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npx --yes "$SEO" run rank --serp
      - name: Competitor and keyword gap (full gap needs DataForSEO)
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENPAGERANK_API_KEY: ${{ secrets.OPENPAGERANK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npx --yes "$SEO" run gap
      - name: Backlink and authority profile (export, DataForSEO, Open PageRank)
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENPAGERANK_API_KEY: ${{ secrets.OPENPAGERANK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npx --yes "$SEO" run authority
      - name: Structured data checks and drafts for the home page and top pages
        continue-on-error: true
        run: npx --yes "$SEO" run schema
      - name: Local business checks (name, address, phone; location pages). Runs only when the local pack applies
        continue-on-error: true
        run: npx --yes "$SEO" run local
      - name: Online shop checks (product markup and prices, stock, categories, filter URLs). Runs only when the e-commerce pack applies
        continue-on-error: true
        run: npx --yes "$SEO" run shop
      - name: Page change monitor (your key pages and competitors' winning pages)
        continue-on-error: true
        run: npx --yes "$SEO" run changes
      - name: Real-user Core Web Vitals (Chrome UX Report; skips cleanly without a key)
        continue-on-error: true
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: npx --yes "$SEO" run vitals
      - name: Which agents to run this week (agent plan issue; with SEO_AUTOPILOT=true also work-order issues the autopilot drafts)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SEO_AUTOPILOT: ${{ vars.SEO_AUTOPILOT }}
          SEO_AUTOPILOT_PAUSED: ${{ vars.SEO_AUTOPILOT_PAUSED }}
        run: npx --yes "$SEO" run team
      - name: Evaluate logged experiments
        continue-on-error: true
        run: npx --yes "$SEO" run experiments
      - name: Weekly digest
        continue-on-error: true
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEO_INGEST_URL: ${{ secrets.SEO_INGEST_URL }}
          SEO_INGEST_TOKEN: ${{ secrets.SEO_INGEST_TOKEN }}
        run: npx --yes "$SEO" run digest
      - name: Backlinks to do by hand
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx --yes "$SEO" run backlinks-queue
      - name: Pages to request indexing for by hand
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx --yes "$SEO" run indexing-queue
      - name: Save state
        run: npx --yes "$SEO" state save
