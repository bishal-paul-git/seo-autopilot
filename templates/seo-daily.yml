# Cloud scheduler for the SEO pack. Copy to .github/workflows/seo-daily.yml in the repo that holds
# ./ (GitHub runs it on its servers, so no computer needs to be on). Not enabled by default.
#
# Repo secrets to add (Settings > Secrets and variables > Actions):
#   GOOGLE_KEY_JSON          full contents of the Google service-account JSON
#   INDEXNOW_KEY_<SITE>      one per site, names must match sites.json -> indexNowKeyEnv
# Daily state (inspection results, IndexNow history, summaries) is kept on the 'seo-data' branch.
name: seo-daily
on:
  schedule: [{ cron: "17 5 * * *" }]   # 05:17 UTC every day
  workflow_dispatch: {}                 # "Run workflow" button
permissions:
  contents: write
concurrency: seo-daily
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Restore state from seo-data branch
        run: |
          if git ls-remote --exit-code origin seo-data >/dev/null 2>&1; then
            git fetch origin seo-data
            git checkout origin/seo-data -- reports 2>/dev/null || true
          fi
      - name: Daily report and URL inspection
        env: { GOOGLE_KEY_JSON: "${{ secrets.GOOGLE_KEY_JSON }}" }
        run: node daily.mjs
      - name: IndexNow
        env:
          INDEXNOW_KEY_EXAMPLE: ${{ secrets.INDEXNOW_KEY_EXAMPLE }}
        run: node indexnow.mjs
      - name: Save state to seo-data branch
        run: |
          git config user.name "seo-autopilot"; git config user.email "seo-autopilot@users.noreply.github.com"
          d=$(mktemp -d); cp -r reports "$d/reports"
          git checkout --orphan seo-data-new && git rm -rf -q . && cp -r "$d/reports" reports
          git add -f reports && git commit -q -m "seo data $(date -u +%F)" && git push -f origin HEAD:seo-data
