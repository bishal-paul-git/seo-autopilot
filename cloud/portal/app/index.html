<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0f14">
<title>SEO Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first app. Phone: sticky header, content, bottom tab bar. Desktop: left page rail + wide content. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #0f1419; --muted: #636c78; --line: #e3e6eb; --line-2: #eef0f3;
  --side: #0c0f14; --side-2: #161b23; --side-ink: #cdd4dd; --side-muted: #7f8995;
  --accent: #0f9d74; --accent-ink: #ffffff; --accent-soft: #e2f5ed;
  --warn: #b26a12; --warn-soft: #fdf1e1; --bad: #c2382f; --bad-soft: #fde9e7; --info: #3559c7; --info-soft: #e8eefc;
  --chart: #0f9d74; --chart-2: #8e9aab;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --panel: #161a21; --ink: #e8ebef; --muted: #98a1ad; --line: #262c35; --line-2: #1d222a;
  --accent: #34c99c; --accent-ink: #052a1e; --accent-soft: #123328;
  --warn: #e3a556; --warn-soft: #382a17; --bad: #f07a71; --bad-soft: #3b1d1b; --info: #8ba6f5; --info-soft: #1d2640;
  --chart: #34c99c; --chart-2: #5b6574; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --ink: #e8ebef; --muted: #98a1ad; --line: #262c35; --line-2: #1d222a;
  --accent: #34c99c; --accent-ink: #052a1e; --accent-soft: #123328;
  --warn: #e3a556; --warn-soft: #382a17; --bad: #f07a71; --bad-soft: #3b1d1b; --info: #8ba6f5; --info-soft: #1d2640;
  --chart: #34c99c; --chart-2: #5b6574; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
a { color: inherit }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh }

/* Desktop rail */
.rail { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-block: 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; text-decoration: none }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none }
.brand-mark svg { width: 18px; height: 18px }
.brand b { color: #fff; font-weight: 600; font-size: 15px; display: block; line-height: 1.2 }
.brand span { font: 11px var(--mono); color: var(--side-muted) }
.rail .lbl { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); padding: 0 8px; margin-bottom: 6px }
.rail nav { display: flex; flex-direction: column; gap: 2px }
.rail nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--side-ink); font-weight: 500; font-size: 14px }
.rail nav a:hover { background: var(--side-2) }
.rail nav a[aria-current="page"] { background: var(--side-2); color: #fff }
.rail nav a svg { width: 17px; height: 17px; flex: none; opacity: .85 }
.rail nav .dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 4px; flex: none }
.dot.live { background: #34c99c } .dot.setup { background: #e3a556 }
.rail .foot { margin-top: auto; font-size: 12px; color: var(--side-muted); padding: 0 8px; line-height: 1.5 }

/* Header */
.main { min-width: 0; display: flex; flex-direction: column }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: 28px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.hdr .site { min-width: 0 }
.hdr .site b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hdr .site span { font-size: 12px; color: var(--muted) }
.hdr .sp { flex: 1 }
.hdr .mobile-brand { display: none }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 13.5px; text-decoration: none; cursor: pointer; white-space: nowrap }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn svg { width: 15px; height: 15px }
.page { padding-block: 22px 40px; padding-left: 28px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; max-width: 1180px; width: 100% }
h1 { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; margin: 0; text-wrap: balance }
.lead { color: var(--muted); margin: 4px 0 0; max-width: 68ch }
h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em }

/* Cards */
.grid { display: grid; gap: 12px }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0 }
.card.pad0 { padding: 0 }
.ch { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 12px }
.pad0 .ch { padding: 16px 16px 0 }
.ch p { margin: 0; color: var(--muted); font-size: 13px }
.ch .r { margin-left: auto }
.kpi .l { font-size: 13px; color: var(--muted) }
.kpi .v { font: 600 26px/1.15 var(--sans); letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums }
.kpi .v small { font-size: 14px; color: var(--muted); font-weight: 500 }
.kpi .d { font-size: 12.5px; margin-top: 4px; color: var(--muted) }
.kpi .help { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4 }
.up { color: var(--accent) } .down { color: var(--bad) }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--sans); padding: 3px 9px; border-radius: 99px; background: var(--line-2); color: var(--muted); white-space: nowrap }
.pill.ok { background: var(--accent-soft); color: var(--accent) } .pill.warn { background: var(--warn-soft); color: var(--warn) } .pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.info { background: var(--info-soft); color: var(--info) }
.pill i { width: 6px; height: 6px; border-radius: 50% ; background: currentColor }
.muted { color: var(--muted) } .sm { font-size: 13px } .xs { font-size: 12px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
svg text { fill: var(--muted); font: 10px var(--mono) }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center }
.ring { width: 92px; height: 92px; position: relative; flex: none }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 26px var(--sans); letter-spacing: -0.02em }
.ring small { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 10.5px; color: var(--muted) }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--panel); border-radius: 12px; padding: 13px 15px; font-size: 14px }
.callout.ok { border-left-color: var(--accent) } .callout.info { border-left-color: var(--info) }

/* Lists */
.list { display: flex; flex-direction: column }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-2) }
.row:first-child { border-top: 0 }
.row .t { font-weight: 500; overflow-wrap: anywhere }
.row .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere }
.row .end { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px }
.pos { display: inline-grid; place-items: center; min-width: 44px; padding: 3px 8px; border-radius: 8px; font: 600 13px var(--mono) }
.pos.p1 { background: var(--accent-soft); color: var(--accent) } .pos.p2 { background: var(--info-soft); color: var(--info) } .pos.p3 { background: var(--warn-soft); color: var(--warn) } .pos.p4 { background: var(--line-2); color: var(--muted) }
.score { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 600 13.5px var(--mono); flex: none }
.score.ok { background: var(--accent-soft); color: var(--accent) } .score.warn { background: var(--warn-soft); color: var(--warn) } .score.bad { background: var(--bad-soft); color: var(--bad) }
.prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-2) }
.prow:first-child { border-top: 0 }
.seg { display: flex; gap: 6px; flex-wrap: wrap }
.seg button { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: inherit; color: var(--ink) }
.bar { height: 10px; border-radius: 99px; background: var(--line-2); overflow: hidden; display: flex }
.bar span { height: 100%; display: block }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted) }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.legend b { color: var(--ink); font-family: var(--mono); font-weight: 500 }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-size: 12.5px; padding: 4px 9px; border-radius: 8px; background: var(--line-2); color: var(--muted); display: inline-flex; gap: 6px; align-items: center }
.chip.ok { background: var(--accent-soft); color: var(--accent) }
.chip.warn { background: var(--warn-soft); color: var(--warn) }
.report h3 { font-size: 15px; margin: 18px 0 6px } .report h3:first-child { margin-top: 0 }
.report ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px }
.report p { margin: 0 0 6px; font-size: 14px }
.form { display: grid; gap: 12px; max-width: 420px }
.form label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 500 }
.form input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: inherit; color: var(--ink) }
.form .err { color: var(--bad); font-size: 13.5px; min-height: 1em }
.secret { font-family: var(--mono); font-size: 12.5px; padding: 10px 12px; border-radius: 10px; background: var(--line-2); overflow-wrap: anywhere; user-select: all }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px }
.tbl { overflow-x: auto } table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 11px 16px; border-bottom: 1px solid var(--line-2) } tr:last-child td { border-bottom: 0 }
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px }
.site-card { text-decoration: none; display: flex; flex-direction: column; gap: 12px }
.site-card:hover { border-color: var(--accent) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30 }

/* Mobile bottom bar and sheet */
.tabbar { display: none }
.sheet { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .4); display: flex; align-items: flex-end }
.sheet .panel { background: var(--panel); width: 100%; border-radius: 18px 18px 0 0; padding: 10px 12px calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)) }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px }
.sheet a { display: flex; align-items: center; gap: 12px; padding: 13px 10px; border-radius: 10px; text-decoration: none; font-weight: 500 }
.sheet a:active { background: var(--line-2) }
.sheet a svg { width: 20px; height: 20px; color: var(--muted) }

@media (max-width: 960px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .g3 { grid-template-columns: 1fr } }
@media (max-width: 760px) {
  body { font-size: 15px }
  .app { grid-template-columns: 1fr }
  .rail { display: none }
  .hdr { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .hdr .mobile-brand { display: grid }
  .page { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); gap: 14px }
  .g2 { grid-template-columns: 1fr }
  h1 { font-size: 21px }
  .kpi .v { font-size: 23px }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)) }
  .tabbar a, .tabbar button { all: unset; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: center }
  .tabbar svg { width: 22px; height: 22px }
  .tabbar [aria-current="page"] { color: var(--accent) }
  .hero { grid-template-columns: 1fr; justify-items: start }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
  .g3 .kpi { padding: 12px }
  .g3 .kpi .v { font-size: 20px }
  .g3 .kpi .help, .g3 .kpi .d { display: none }
  .g3 .kpi .l { font-size: 12px; line-height: 1.3 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="hdr" id="hdr"></header>
    <main class="page" id="page"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div id="overlay"></div>

<script>
// The portal app. Reads from the portal's Supabase project over its REST API with the public (publishable) key; what a
// person can see is decided by the database (row level security), not by this page. No libraries.
const CFG = __CONFIG__;
const DEPTS = __DEPTS__;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => (n == null || Number.isNaN(Number(n)) ? "–" : Number(n).toLocaleString("en-GB", { maximumFractionDigits: d }));
const host = (u) => String(u || "").replace(/^https?:\/\//, "").replace(/\/$/, "");
const toast = (m) => { document.querySelectorAll(".toast").forEach((x) => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

/* ---------- API: Supabase Auth and REST, plain fetch ---------- */
const SKEY = "seo-portal-session";
let session = (() => { try { return JSON.parse(localStorage.getItem(SKEY) || "null"); } catch { return null; } })();
const saveSession = (s) => { session = s; try { s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); } catch {} };
async function authCall(path, body) {
  const r = await fetch(`${CFG.supabaseUrl}/auth/v1/${path}`, { method: "POST", headers: { apikey: CFG.anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || `Sign-in failed (${r.status})`);
  return j;
}
const keep = (j) => saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() / 1000 + (j.expires_in || 3600), email: j.user?.email });
async function token() {
  if (!session) return null;
  if (session.expires_at - 60 < Date.now() / 1000) {
    try { keep(await authCall("token?grant_type=refresh_token", { refresh_token: session.refresh_token })); } catch { saveSession(null); return null; }
  }
  return session.access_token;
}
async function api(path, { method = "GET", body, anon = false } = {}) {
  const t = anon ? null : await token();
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/${path}`, { method, headers: { apikey: CFG.anonKey, Authorization: `Bearer ${t || CFG.anonKey}`, "Content-Type": "application/json", Prefer: "return=representation" }, body: body ? JSON.stringify(body) : undefined });
  const j = r.status === 204 ? null : await r.json().catch(() => null);
  if (r.status === 401 && !anon) { saveSession(null); location.hash = "#/login"; throw new Error("Please sign in again."); }
  if (!r.ok) throw new Error(j?.message || `Request failed (${r.status})`);
  return j;
}
const rpc = (fn, args = {}, opts = {}) => api(`rpc/${fn}`, { method: "POST", body: args, ...opts });

/* ---------- Data: a site row plus its latest snapshot, flattened for the pages ---------- */
const EMPTY = { history: [], issues: [], decisions: [], growth: [], keywords: [], targets: [], pages: [], locations: [], proposals: [], priorities: [], plan: [], runs: [], coverage: [], notIndexed: [], integrations: [], period: { cur: {}, prev: {} }, audit: null, digest: "" };
function toSite(row, data, key, extra = {}) {
  const d = data || {};
  return { ...EMPTY, ...d, ...extra, key, id: row.id, name: row.name, url: row.url, repo: row.repo, status: data ? "live" : row.status === "live" ? "live" : "connecting", lastAt: row.last_snapshot_at, market: d.site?.market, platform: d.site?.platform, period: d.period || EMPTY.period };
}
let SITES = [], loaded = false;
let ORG = null;
async function loadAgency() {
  SITES = (await rpc("my_sites")).map((x) => toSite(x.site, x.data, x.site.id, { decisions: x.decisions || [] }));
  ORG = await rpc("my_org").catch(() => null); loaded = true;
}
async function loadGrowth(s) { if (!s.growthLoaded) { s.growth = await rpc("site_growth", { p_site: s.id }).catch(() => []); s.growthLoaded = true; } }
const shared = new Map();
async function loadShared(t) {
  if (!shared.has(t)) { const j = await rpc("shared_site", { p_token: t }, { anon: true }); shared.set(t, j ? toSite(j.site, j.data, t, { growth: j.growth || [], growthLoaded: true, brand: j.brand || null }) : null); }
  return shared.get(t);
}

/* ---------- Shared bits ---------- */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>',

const PAGES = [["overview", "Overview", I.home], ["traffic", "Traffic", I.trend], ["keywords", "Keywords", I.key], ["pages", "Pages", I.page], ["locations", "Locations", I.pin], ["plan", "Coming next", I.plan], ["report", "Weekly report", I.report], ["approvals", "Approvals", I.check], ["team", "SEO team", I.team], ["connect", "Connection", I.plug]];
const AGENCY_ONLY = new Set(["approvals", "team", "connect"]);
const MOBILE_TABS = ["overview", "traffic", "keywords", "pages"];
let state = { kwTab: "ranking", kwQ: "", pgFilter: "all", newToken: null };

const last = (s) => s.history[s.history.length - 1] || {};
const first = (s) => s.history[0] || {};
const tone = (v) => (v >= 85 ? "ok" : v >= 70 ? "warn" : "bad");
const isIdx = (p) => /^submitted and indexed$|^indexed, not submitted in sitemap$/i.test(p.indexed || "");
function health(s) {

const posClass = (p) => (p == null ? "p4" : p <= 3 ? "p1" : p <= 10 ? "p2" : p <= 20 ? "p3" : "p4");
const posLabel = (p) => (p == null ? "–" : p <= 3 ? "Top 3" : p <= 10 ? "Page 1" : p <= 20 ? "Page 2" : "Page 3+");
function pct(a, b) { if (!b) return null; return Math.round(((a - b) / b) * 100); }
function change(a, b, invert = false) {

  const p = invert ? -pct(a, b) : pct(a, b);
  if (!p) return `<span class="muted">no change</span>`;
  return `<span class="${p > 0 ? "up" : "down"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p)}%</span> <span class="muted">vs previous 28 days</span>`;
}

function chart(points, key, { h = 170, color = "var(--chart)", label = "", fmtY = (v) => fmt(v) } = {}) {
  points = (points || []).filter((p) => p[key] != null);
  if (points.length < 2) return '<div class="empty">Not enough days yet for a chart.</div>';
  const w = 620, pad = { l: 40, r: 10, t: 10, b: 22 };
  const vals = points.map((p) => p[key]);
  const max = Math.max(...vals), min = Math.min(...vals, 0);
  const x = (i) => pad.l + (i * (w - pad.l - pad.r)) / Math.max(points.length - 1, 1);
  const y = (v) => pad.t + (h - pad.t - pad.b) * (1 - (v - min) / (max - min || 1));
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  const n = points.length - 1, id = "g" + key + Math.random().toString(36).slice(2, 6);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[min, (min + max) / 2, max].map((t) => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pad.l - 6}" y="${y(t) + 3}" text-anchor="end">${fmtY(t)}</text>`).join("")}
    <path d="${d}L${x(n)},${h - pad.b}L${x(0)},${h - pad.b}Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n)}" cy="${y(points[n][key])}" r="4.5" fill="${color}"/>
    <text x="${x(0)}" y="${h - 5}">${esc(String(points[0].day).slice(5))}</text><text x="${x(n)}" y="${h - 5}" text-anchor="end">${esc(String(points[n].day).slice(5))}</text>
  </svg>`;
}
function ring(v) {

}
const bars = (rows, total, label = (x) => x.key) => `<div class="list">${rows.map((x) => `<div class="row"><div style="flex:1;min-width:0"><div class="t">${esc(label(x))}</div><div class="bar" style="height:6px;margin-top:6px"><span style="width:${Math.round((x.v / (total || 1)) * 100)}%;background:var(--accent)"></span></div></div><div class="end"><b class="mono">${fmt(x.v)}</b><span class="xs muted">${x.note || ""}</span></div></div>`).join("")}</div>`;

/* ---------- Pages ---------- */
function pOverview(s) {
  const c = s.period.cur, p = s.period.prev, l = last(s), f = first(s), h = health(s);
  const top = s.keywords.slice(0, 5);
  const next = [...s.proposals.map((x) => x.title), ...s.priorities.slice(0, 3).map((x) => x.title)].slice(0, 4);
  return `<div class="card hero">${ring(h)}<div><h1>${esc(s.name)}</h1><p class="lead">${summary(s)}</p></div></div>
  <div class="grid g4">
    ${kpi("Google impressions", c.impressions, change(c.impressions, p.impressions), "Times your pages showed in Google search, last 28 days")}
    ${kpi("Visits from Google", c.clicks, change(c.clicks, p.clicks), "Clicks from Google search to the site")}
    ${kpi("Average position", c.position, change(c.position, p.position, true), "Where you appear on average. Lower is better; 1–10 is page one")}
    ${kpi("Pages in Google", `${fmt(l.indexed)}<small> / ${fmt(l.inspected)}</small>`, l.indexed > f.indexed ? `<span class="up">▲ ${l.indexed - f.indexed}</span> <span class="muted">since ${esc(String(f.day).slice(5))}</span>` : "", "Pages Google has indexed and can show")}
  </div>
  <div class="grid g2">
    <div class="card"><div class="ch"><h2>Daily impressions</h2><p>How often Google shows the site</p></div>${chart(s.history, "impressions", { label: "Daily impressions" })}</div>
    <div class="card pad0"><div class="ch"><h2>Top keywords</h2><a class="r btn" href="${link(s, "keywords")}">All keywords</a></div><div class="list">${top.map(kwRow).join("") || '<div class="empty">No searches yet.</div>'}</div></div>
  </div>
  <div class="grid g2">
    <div class="card pad0"><div class="ch"><h2>Coming next</h2><a class="r btn" href="${link(s, "plan")}">Plan</a></div><div class="list">${next.map((t) => `<div class="row"><div><div class="t">${esc(t)}</div></div><span class="pill info">Planned</span></div>`).join("") || '<div class="empty">Nothing planned yet.</div>'}</div></div>
    <div class="card"><div class="ch"><h2>Where visitors come from</h2></div>${sourcesBlock(s)}</div>
  </div>

// Growth across stored daily snapshots: the average page score and the searches the site shows up for.
function growthCard(s) {
  const g = (s.growth || []).map((r) => ({ ...r, day: String(r.at).slice(0, 10) }));
  if (g.length < 2) return `<div class="card"><div class="ch"><h2>Growth over time</h2><p>Builds up from the daily snapshots</p></div><div class="empty">${g.length ? "One snapshot so far. The trend appears after the second day." : "The trend appears after the first daily snapshots."}</div></div>`;
  const a = g[0], b = g[g.length - 1], d = (k) => (b[k] ?? 0) - (a[k] ?? 0);
  const sign = (n, dp = 0) => (n > 0 ? `<span class="up">▲ ${fmt(n, dp)}</span>` : n < 0 ? `<span class="down">▼ ${fmt(-n, dp)}</span>` : `<span class="muted">no change</span>`);
  return `<div class="card"><div class="ch"><h2>Growth over time</h2><p>${g.length} daily snapshots since ${esc(a.day)}</p></div>
    <div class="grid g3" style="margin-bottom:12px">${kpi("Average page score", b.score, sign(d("score"), 1) + " since start", "Higher is better")}${kpi("Searches you appear for", b.keywords, sign(d("keywords")) + " since start", "Top 80 kept")}${kpi("Pages in Google", b.indexed, sign(d("indexed")) + " since start", "Pages indexed")}</div>
    <div class="grid g2"><div>${chart(g, "score", { label: "Average page score", fmtY: (v) => fmt(v, 0) })}</div><div>${chart(g, "keywords", { label: "Searches the site appears for", color: "var(--info)" })}</div></div></div>`;
}
function summary(s) {
  const c = s.period.cur, l = last(s);
  const bits = [`Google showed the site <b>${fmt(c.impressions)}</b> times in the last 28 days for <b>${fmt(c.queries)}</b> different searches`];
  bits.push(c.clicks ? `bringing <b>${fmt(c.clicks)}</b> visits` : `with no clicks yet: most pages still rank beyond page one`);
  if (l.inspected) bits.push(`<b>${fmt(l.indexed)}</b> of ${fmt(l.inspected)} pages are in Google`);

}
const CHANNEL = { "Organic Search": "Google and other search", Direct: "Direct (typed or bookmarked)", Referral: "Links on other sites", "Organic Social": "Social media", "Paid Search": "Search ads", Email: "Email", Unassigned: "Not known" };

      bars(g.channels.map((x) => ({ key: CHANNEL[x.key] || x.key, v: x.sessions, note: x.prev ? `${pct(x.sessions, x.prev) > 0 ? "▲" : "▼"} ${Math.abs(pct(x.sessions, x.prev) || 0)}%` : "visits" })), tot);
  }
  const why = g?.error ? `Google Analytics could not be read: ${esc(g.error)}` : "<b>Google Analytics is not connected yet.</b> Once it is, this shows visitors by channel (Google, social, direct, referrals), country and device.";
  const cs = s.search?.countries || [];

  ${cs.length ? `<div class="lbl" style="margin-top:12px">Google clicks by country</div>${bars(cs.slice(0, 5).map((x) => ({ key: country(x.key), v: x.clicks, note: `${fmt(x.impressions)} impr.` })), cs.reduce((a, x) => a + x.clicks, 0))}` : `<div class="legend" style="margin-top:12px"><span><i style="background:var(--accent)"></i>Google search <b>${fmt(s.period.cur.clicks)}</b> visits</span><span><i style="background:var(--line)"></i>Other channels <b>needs Analytics</b></span></div>`}`;

const country = (c) => { try { return new Intl.DisplayNames(["en"], { type: "region" }).of(String(c).length === 3 ? ISO3[String(c).toUpperCase()] || String(c).toUpperCase() : String(c).toUpperCase()); } catch { return String(c).toUpperCase(); } };
const ISO3 = { GBR: "GB", USA: "US", IND: "IN", CAN: "CA", AUS: "AU", IRL: "IE", DEU: "DE", FRA: "FR", NLD: "NL", ESP: "ES", ITA: "IT", PAK: "PK", BGD: "BD", NGA: "NG", ZAF: "ZA", ARE: "AE", PHL: "PH", NZL: "NZ", SGP: "SG", POL: "PL" };
function kwRow(k) {

function pTraffic(s) {
  const c = s.period.cur, p = s.period.prev;
  const byPage = [...s.pages].filter((x) => x.i).sort((a, b) => b.i - a.i).slice(0, 10);
  const buckets = [["Top 3", (k) => k.pos <= 3, "var(--accent)"], ["Page 1", (k) => k.pos > 3 && k.pos <= 10, "color-mix(in srgb, var(--accent) 60%, var(--bg))"], ["Page 2", (k) => k.pos > 10 && k.pos <= 20, "var(--warn)"], ["Page 3+", (k) => k.pos > 20, "var(--chart-2)"]];
  const tot = s.keywords.length || 1, g = s.ga4 && !s.ga4.error ? s.ga4 : null, dev = g?.devices?.length ? g.devices.map((x) => ({ key: x.key, v: x.sessions })) : (s.search?.devices || []).map((x) => ({ key: x.key, v: x.clicks }));
  return `<div><h1>Traffic</h1><p class="lead">From Google Search Console, ${esc(s.period.window?.start || "")} to ${esc(s.period.window?.end || "")}${g ? ", and Google Analytics" : ""}.</p></div>
  <div class="grid g4">
    ${kpi("Impressions", c.impressions, change(c.impressions, p.impressions), "Times shown in Google")}
    ${kpi("Clicks", c.clicks, change(c.clicks, p.clicks), "Visits from Google search")}
    ${kpi("Click-through rate", `${fmt(c.ctr, 1)}%`, "", "Share of impressions that became a visit")}

  </div>

  </div>

    ${dev.length ? `<div class="card pad0"><div class="ch"><h2>Devices</h2><p>${g ? "Visits" : "Google clicks"}</p></div>${bars(dev.map((x) => ({ ...x, key: x.key.charAt(0).toUpperCase() + x.key.slice(1).toLowerCase() })), dev.reduce((a, x) => a + x.v, 0))}</div>` : ""}
  </div>` : ""}`;
}

function pKeywords(s) {
  const q = state.kwQ.toLowerCase();
  const list = state.kwTab === "ranking" ? s.keywords.filter((k) => k.q.includes(q)) : s.targets.filter((k) => k.q.includes(q));
  return `<div><h1>Keywords</h1><p class="lead">Searches the site already shows up for, and the ones we are targeting next.</p></div>

function pPages(s) {

function md(t) {
  const out = []; let list = false;
  for (const raw of String(t || "").split("\n")) {
    const line = raw.trim();
    const inline = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
    if (/^- /.test(line)) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(line.slice(2))}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    if (/^#{2,3} /.test(line)) out.push(`<h3>${inline(line.replace(/^#+ /, ""))}</h3>`);
    else if (/^# /.test(line)) continue;
    else if (line) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

  const bf = $("#brand-form");
  if (bf) bf.onsubmit = async (e) => {
    e.preventDefault(); const err = $("#brand-err"); err.textContent = "";
    try { const r = await api(`orgs?id=eq.${ORG.id}`, { method: "PATCH", body: { brand_name: $("#brand-name").value.trim() || null, brand_color: $("#brand-color").value } }); ORG = { ...ORG, ...(r?.[0] || {}) }; toast("Brand saved"); }
    catch (x) { err.textContent = x.message; }
  };
  const af = $("#add-form");
  if (af) af.onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(af), err = $("#add-err"); err.textContent = "";
    let url = String(f.get("url")).trim(); if (!url.endsWith("/")) url += "/";
    if (!url.startsWith("https://")) { err.textContent = "Use the https:// address."; return; }
    try {
      const j = await rpc("create_site", { p_name: f.get("name"), p_url: url, p_repo: f.get("repo") || null });
      state.newToken = { site: j.site.id, token: j.token }; loaded = false; location.hash = `#/s/${j.site.id}/connect`;
    } catch (x) { err.textContent = x.message; }
  };
}

const PAGE_FN = { overview: pOverview, traffic: pTraffic, keywords: pKeywords, pages: pPages, locations: pLocations, plan: pPlan, report: pReport, team: pTeam, connect: pConnect, approvals: pApprovals };
async function render() {
  const h = location.hash || "#/";
  $("#overlay").innerHTML = "";
  if (!CFG.supabaseUrl || !CFG.anonKey) { shell(null); $("#page").innerHTML = '<div class="callout">This portal is not configured yet (no Supabase address or key at build time).</div>'; return; }
  if (h === "#/logout") { saveSession(null); SITES = []; loaded = false; location.hash = "#/login"; return; }
  const m = h.match(/^#\/(s|c)\/([\w-]+)(?:\/(\w+))?/);
  try {
    if (m && m[1] === "c") {
      mode = "client";
      $("#page").innerHTML = '<div class="empty">Loading…</div>';
      const s = await loadShared(m[2]);
      if (!s) { shell(null); $("#page").innerHTML = '<div class="callout">This link is not valid any more. Ask your SEO team for a new one.</div>'; return; }
      let page = m[3] || "overview"; if (AGENCY_ONLY.has(page)) page = "overview";
      if (/^#[0-9a-f]{6}$/i.test(s.brand?.color || "")) { document.documentElement.style.setProperty("--accent", s.brand.color); document.documentElement.style.setProperty("--chart", s.brand.color); }
      shell(s, page); document.title = `${s.name} · SEO dashboard`;
      $("#page").innerHTML = s.status !== "live" ? pSetup(s) : (PAGE_FN[page] || pOverview)(s);
      return wire(s);
    }
    mode = "agency";
    if (h === "#/login" || h === "#/signup") { shell(null, "login"); document.title = "Sign in · SEO Autopilot"; $("#page").innerHTML = pLogin(); return wire(null); }
    if (!(await token())) { location.hash = "#/login"; return; }
    if (!loaded) { $("#page").innerHTML = '<div class="empty">Loading…</div>'; await loadAgency(); }
    if (h === "#/team") { shell(null, "teampage"); document.title = "Team and brand · SEO Autopilot"; $("#page").innerHTML = pTeamPage(); return wire(null); }
    if (h === "#/add") { shell(null, "add"); document.title = "Connect a website · SEO Autopilot"; $("#page").innerHTML = pAdd(); return wire(null); }
    if (!m) { shell(null); document.title = "Websites · SEO Autopilot"; $("#page").innerHTML = pHome(); return wire(null); }
    const s = SITES.find((x) => x.key === m[2]);
    if (!s) { location.hash = "#/"; return; }
    const page = m[3] || "overview";
    if (page === "overview" && s.status === "live") await loadGrowth(s);
    shell(s, page); document.title = `${s.name} · SEO dashboard`;
    $("#page").innerHTML = s.status !== "live" && page !== "connect" ? pSetup(s) : (PAGE_FN[page] || pOverview)(s);
    wire(s);
  } catch (e) { $("#page").innerHTML = `<div class="callout">${esc(e.message)}</div>`; }
}
let lastHash = "";
addEventListener("hashchange", () => { if (location.hash !== lastHash) { lastHash = location.hash; render(); window.scrollTo(0, 0); } });
render();
</script>
</body>
</html>
