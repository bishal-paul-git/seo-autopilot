<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0f14">
<title>SEO Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first app. Phone: sticky header, content, bottom tab bar. Desktop: left page rail + wide content. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #0f1419; --muted: #636c78; --line: #e3e6eb; --line-2: #eef0f3;
  --side: #0c0f14; --side-2: #161b23; --side-ink: #cdd4dd; --side-muted: #7f8995;
  --accent: #0f9d74; --accent-ink: #ffffff; --accent-soft: #e2f5ed;
  --warn: #b26a12; --warn-soft: #fdf1e1; --bad: #c2382f; --bad-soft: #fde9e7; --info: #3559c7; --info-soft: #e8eefc;
  --chart: #0f9d74; --chart-2: #8e9aab;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --panel: #161a21; --ink: #e8ebef; --muted: #98a1ad; --line: #262c35; --line-2: #1d222a;
  --accent: #34c99c; --accent-ink: #052a1e; --accent-soft: #123328;
  --warn: #e3a556; --warn-soft: #382a17; --bad: #f07a71; --bad-soft: #3b1d1b; --info: #8ba6f5; --info-soft: #1d2640;
  --chart: #34c99c; --chart-2: #5b6574; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --ink: #e8ebef; --muted: #98a1ad; --line: #262c35; --line-2: #1d222a;
  --accent: #34c99c; --accent-ink: #052a1e; --accent-soft: #123328;
  --warn: #e3a556; --warn-soft: #382a17; --bad: #f07a71; --bad-soft: #3b1d1b; --info: #8ba6f5; --info-soft: #1d2640;
  --chart: #34c99c; --chart-2: #5b6574; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
a { color: inherit }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh }

/* Desktop rail */
.rail { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-block: 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; text-decoration: none }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none }
.brand-mark svg { width: 18px; height: 18px }
.brand b { color: #fff; font-weight: 600; font-size: 15px; display: block; line-height: 1.2 }
.brand span { font: 11px var(--mono); color: var(--side-muted) }
.rail .lbl { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); padding: 0 8px; margin-bottom: 6px }
.rail nav { display: flex; flex-direction: column; gap: 2px }
.rail nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--side-ink); font-weight: 500; font-size: 14px }
.rail nav a:hover { background: var(--side-2) }
.rail nav a[aria-current="page"] { background: var(--side-2); color: #fff }
.rail nav a svg { width: 17px; height: 17px; flex: none; opacity: .85 }
.rail nav .dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 4px; flex: none }
.dot.live { background: #34c99c } .dot.setup { background: #e3a556 }
.rail .foot { margin-top: auto; font-size: 12px; color: var(--side-muted); padding: 0 8px; line-height: 1.5 }

/* Header */
.main { min-width: 0; display: flex; flex-direction: column }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: 28px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.hdr .site { min-width: 0 }
.hdr .site b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hdr .site span { font-size: 12px; color: var(--muted) }
.hdr .sp { flex: 1 }
.hdr .mobile-brand { display: none }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 13.5px; text-decoration: none; cursor: pointer; white-space: nowrap }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn svg { width: 15px; height: 15px }
.page { padding-block: 22px 40px; padding-left: 28px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; max-width: 1180px; width: 100% }
h1 { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; margin: 0; text-wrap: balance }
.lead { color: var(--muted); margin: 4px 0 0; max-width: 68ch }
h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em }

/* Cards */
.grid { display: grid; gap: 12px }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0 }
.card.pad0 { padding: 0 }
.ch { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 12px }
.pad0 .ch { padding: 16px 16px 0 }
.ch p { margin: 0; color: var(--muted); font-size: 13px }
.ch .r { margin-left: auto }
.kpi .l { font-size: 13px; color: var(--muted) }
.kpi .v { font: 600 26px/1.15 var(--sans); letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums }
.kpi .v small { font-size: 14px; color: var(--muted); font-weight: 500 }
.kpi .d { font-size: 12.5px; margin-top: 4px; color: var(--muted) }
.kpi .help { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4 }
.up { color: var(--accent) } .down { color: var(--bad) }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px var(--sans); padding: 3px 9px; border-radius: 99px; background: var(--line-2); color: var(--muted); white-space: nowrap }
.pill.ok { background: var(--accent-soft); color: var(--accent) } .pill.warn { background: var(--warn-soft); color: var(--warn) } .pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.info { background: var(--info-soft); color: var(--info) }
.pill i { width: 6px; height: 6px; border-radius: 50% ; background: currentColor }
.muted { color: var(--muted) } .sm { font-size: 13px } .xs { font-size: 12px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
svg text { fill: var(--muted); font: 10px var(--mono) }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center }
.ring { width: 92px; height: 92px; position: relative; flex: none }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 26px var(--sans); letter-spacing: -0.02em }
.ring small { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 10.5px; color: var(--muted) }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--panel); border-radius: 12px; padding: 13px 15px; font-size: 14px }
.callout.ok { border-left-color: var(--accent) } .callout.info { border-left-color: var(--info) }

/* Lists */
.list { display: flex; flex-direction: column }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-2) }
.row:first-child { border-top: 0 }
.row .t { font-weight: 500; overflow-wrap: anywhere }
.row .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere }
.row .end { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px }
.pos { display: inline-grid; place-items: center; min-width: 44px; padding: 3px 8px; border-radius: 8px; font: 600 13px var(--mono) }
.pos.p1 { background: var(--accent-soft); color: var(--accent) } .pos.p2 { background: var(--info-soft); color: var(--info) } .pos.p3 { background: var(--warn-soft); color: var(--warn) } .pos.p4 { background: var(--line-2); color: var(--muted) }
.score { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 600 13.5px var(--mono); flex: none }
.score.ok { background: var(--accent-soft); color: var(--accent) } .score.warn { background: var(--warn-soft); color: var(--warn) } .score.bad { background: var(--bad-soft); color: var(--bad) }
.prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-2) }
.prow:first-child { border-top: 0 }
.seg { display: flex; gap: 6px; flex-wrap: wrap }
.seg button { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: inherit; color: var(--ink) }
.bar { height: 10px; border-radius: 99px; background: var(--line-2); overflow: hidden; display: flex }
.bar span { height: 100%; display: block }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted) }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.legend b { color: var(--ink); font-family: var(--mono); font-weight: 500 }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-size: 12.5px; padding: 4px 9px; border-radius: 8px; background: var(--line-2); color: var(--muted); display: inline-flex; gap: 6px; align-items: center }
.chip.ok { background: var(--accent-soft); color: var(--accent) }
.chip.warn { background: var(--warn-soft); color: var(--warn) }
.report h3 { font-size: 15px; margin: 18px 0 6px } .report h3:first-child { margin-top: 0 }
.report ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px }
.report p { margin: 0 0 6px; font-size: 14px }
.form { display: grid; gap: 12px; max-width: 420px }
.form label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 500 }
.form input, .form textarea { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: inherit; color: var(--ink) }
.form .err { color: var(--bad); font-size: 13.5px; min-height: 1em }
.secret { font-family: var(--mono); font-size: 12.5px; padding: 10px 12px; border-radius: 10px; background: var(--line-2); overflow-wrap: anywhere; user-select: all }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px }
.tbl { overflow-x: auto } table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 11px 16px; border-bottom: 1px solid var(--line-2) } tr:last-child td { border-bottom: 0 }
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px }
.site-card { text-decoration: none; display: flex; flex-direction: column; gap: 12px }
.site-card:hover { border-color: var(--accent) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30 }

/* Mobile bottom bar and sheet */
.tabbar { display: none }
.sheet { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .4); display: flex; align-items: flex-end }
.sheet .panel { background: var(--panel); width: 100%; border-radius: 18px 18px 0 0; padding: 10px 12px calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)) }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px }
.sheet a { display: flex; align-items: center; gap: 12px; padding: 13px 10px; border-radius: 10px; text-decoration: none; font-weight: 500 }
.sheet a:active { background: var(--line-2) }
.sheet a svg { width: 20px; height: 20px; color: var(--muted) }

@media (max-width: 960px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .g3 { grid-template-columns: 1fr } }
@media (max-width: 760px) {
  body { font-size: 15px }
  .app { grid-template-columns: 1fr }
  .rail { display: none }
  .hdr { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .hdr .mobile-brand { display: grid }
  .page { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); gap: 14px }
  .g2 { grid-template-columns: 1fr }
  h1 { font-size: 21px }
  .kpi .v { font-size: 23px }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)) }
  .tabbar a, .tabbar button { all: unset; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: center }
  .tabbar svg { width: 22px; height: 22px }
  .tabbar [aria-current="page"] { color: var(--accent) }
  .hero { grid-template-columns: 1fr; justify-items: start }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
  .g3 .kpi { padding: 12px }
  .g3 .kpi .v { font-size: 20px }
  .g3 .kpi .help, .g3 .kpi .d { display: none }
  .g3 .kpi .l { font-size: 12px; line-height: 1.3 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
  pre.wo{white-space:pre-wrap;word-break:break-word;background:var(--bg2,rgba(127,127,127,.08));padding:8px;border-radius:6px;font-size:12px;max-height:240px;overflow:auto;margin:0}
  .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
  .note.unread{background:var(--accent-soft,rgba(16,185,129,.08))}
  @media print{#rail,#hdr,#tabbar,.no-print,.toast{display:none!important}.card{break-inside:avoid;box-shadow:none}body{background:#fff}}
  .swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 0;border:1px solid var(--line)}
/* Live pipeline and connections (D54): a tilted 3D board of stations with flowing connectors; flat and stacked on phones. */
.pipe-head { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px }
.pipe-stage { perspective: 1400px; margin: 4px 0 18px }
.pipe-board { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 26px; padding: 26px 22px 30px; border-radius: 22px;
  background: radial-gradient(120% 140% at 50% 0%, color-mix(in srgb, var(--accent) 14%, var(--panel)) 0%, var(--panel) 62%);
  border: 1px solid var(--line); transform: rotateX(16deg); transform-style: preserve-3d; transform-origin: 50% 100%;
  box-shadow: 0 30px 60px -30px rgb(0 0 0 / .35) }
.pipe-board::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 28px 28px; opacity: .35 }
.pnode { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 6px; padding: 14px 12px 12px; min-height: 132px; border-radius: 16px; cursor: pointer; text-align: left;
  font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); transform: translateZ(26px);
  box-shadow: 0 1px 0 var(--line), 0 14px 24px -14px rgb(0 0 0 / .45); transition: transform .2s ease, box-shadow .2s ease }
.pnode:hover, .pnode:focus-visible { transform: translateZ(46px) translateY(-3px); box-shadow: 0 22px 34px -16px rgb(0 0 0 / .5) }
.pnode .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--line-2); color: var(--muted) }
.pnode .ic svg { width: 18px; height: 18px }
.pnode b { font-size: 14px } .pnode .sub { font-size: 12px; color: var(--muted); line-height: 1.35 }
.pnode .num { font: 600 22px/1 var(--mono, ui-monospace, monospace); margin-top: auto }
.pnode.ok .ic { background: var(--accent-soft); color: var(--accent) }
.pnode.busy .ic { background: var(--info-soft); color: var(--info) } .pnode.busy { border-color: color-mix(in srgb, var(--info) 45%, var(--line)) }
.pnode.warn .ic { background: var(--warn-soft); color: var(--warn) } .pnode.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)) }
.pnode.bad .ic { background: var(--bad-soft); color: var(--bad) } .pnode.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)) }
.pnode.off { opacity: .6 }
.pnode.busy::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 2px solid var(--info); opacity: 0; animation: pulse 2s ease-out infinite }
.pflow { position: absolute; z-index: 0; top: 50%; right: -26px; width: 26px; height: 4px; transform: translateY(-50%) translateZ(10px); border-radius: 4px; background: var(--line); overflow: hidden }
.pflow.on { background: color-mix(in srgb, var(--accent) 25%, var(--line)) }
.pflow.on::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 4px; background: var(--accent); animation: flow 1.4s linear infinite }
@keyframes flow { to { left: 100% } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1) } 100% { opacity: 0; transform: scale(1.06) } }
.dotlive { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none }
.dotlive.ok { background: var(--accent) } .dotlive.busy { background: var(--info); animation: blink 1.2s ease-in-out infinite } .dotlive.warn { background: var(--warn) } .dotlive.bad { background: var(--bad) }
@keyframes blink { 50% { opacity: .3 } }
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px }
.agent-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); text-decoration: none; color: inherit }
.agent-card .t { display: flex; align-items: center; gap: 8px; font-weight: 600; text-transform: capitalize }
.conn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px }
.conn { padding: 14px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; background: var(--panel); display: flex; flex-direction: column; gap: 6px }
.guide-list { margin: 0; padding: 0 16px 14px 34px; display: grid; gap: 8px } .guide-list > li { padding: 8px 0; border-top: 1px solid var(--line) }
.guide-list summary { cursor: pointer; display: flex; gap: 8px; align-items: center; flex-wrap: wrap } .guide-list ol { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px }
.guide-list code { overflow-wrap: anywhere } .guide { margin-top: 16px }
.setup { margin-bottom: 16px } .steps { list-style: none; margin: 0; padding: 4px 16px 14px; display: grid; gap: 10px }
.steps > li { display: flex; gap: 12px; align-items: flex-start; padding-top: 10px; border-top: 1px solid var(--line) } .steps > li:first-child { border-top: 0 }
.steps .sn { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 12.5px var(--sans); background: var(--line-2); color: var(--muted) }
.steps li.done .sn { background: var(--accent); color: var(--accent-ink) } .steps li.now .sn { background: var(--info-soft); color: var(--info) }

<script>
// The portal app. Reads from the portal's Supabase project over its REST API with the public (publishable) key; what a
// person can see is decided by the database (row level security), not by this page. No libraries.
const CFG = __CONFIG__;
const BRIEF = __BRIEF__; // the business brief asked when a website is added (src/god/onboarding.mjs, D44)
const AGENTS = __AGENTS__; // each agent's instructions and the playbooks and skills it reads (D45, D46), from the repository
const ORG_CHART = __ORG__; // the director and the eight departments of the master spec, with their agents and engine jobs
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => (n == null || Number.isNaN(Number(n)) ? "–" : Number(n).toLocaleString("en-GB", { maximumFractionDigits: d }));
const host = (u) => String(u || "").replace(/^https?:\/\//, "").replace(/\/$/, "");
const toast = (m) => { document.querySelectorAll(".toast").forEach((x) => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

/* ---------- API: Supabase Auth and REST, plain fetch ---------- */
const SKEY = "seo-portal-session";
let session = (() => { try { return JSON.parse(localStorage.getItem(SKEY) || "null"); } catch { return null; } })();
const saveSession = (s) => { session = s; try { s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); } catch {} };
async function authCall(path, body) {
  const r = await fetch(`${CFG.supabaseUrl}/auth/v1/${path}`, { method: "POST", headers: { apikey: CFG.anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || `Sign-in failed (${r.status})`);
  return j;
}
const keep = (j) => saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() / 1000 + (j.expires_in || 3600), email: j.user?.email });
async function token() {
  if (!session) return null;
  if (session.expires_at - 60 < Date.now() / 1000) {
    try { keep(await authCall("token?grant_type=refresh_token", { refresh_token: session.refresh_token })); } catch { saveSession(null); return null; }
  }
  return session.access_token;
}
async function api(path, { method = "GET", body, anon = false } = {}) {
  const t = anon ? null : await token();
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/${path}`, { method, headers: { apikey: CFG.anonKey, Authorization: `Bearer ${t || CFG.anonKey}`, "Content-Type": "application/json", Prefer: "return=representation" }, body: body ? JSON.stringify(body) : undefined });
  const j = r.status === 204 ? null : await r.json().catch(() => null);
  if (r.status === 401 && !anon) { saveSession(null); location.hash = "#/login"; throw new Error("Please sign in again."); }
  if (!r.ok) throw new Error(j?.message || `Request failed (${r.status})`);
  return j;
}
const rpc = (fn, args = {}, opts = {}) => api(`rpc/${fn}`, { method: "POST", body: args, ...opts });

/* ---------- Data: a site row plus its latest snapshot, flattened for the pages ---------- */
const EMPTY = { history: [], issues: [], decisions: [], growth: [], keywords: [], targets: [], pages: [], locations: [], proposals: [], priorities: [], plan: [], runs: [], coverage: [], notIndexed: [], integrations: [], period: { cur: {}, prev: {} }, audit: null, digest: "" };
function toSite(row, data, key, extra = {}) {
  const d = data || {};
  return { ...EMPTY, ...d, ...extra, key, id: row.id, name: row.name, url: row.url, repo: row.repo, status: data ? "live" : row.status === "live" ? "live" : row.status === "scanning" ? "scanning" : "connecting", byUrl: row.mode === "url", scanState: row.scan_state || null, scanError: row.scan_error || null, nextScan: row.next_scan_at || null, lastAt: row.last_snapshot_at, market: d.site?.market, platform: d.site?.platform, period: d.period || EMPTY.period };
}
let SITES = [], CLIENT_SITES = [], loaded = false;
let ORG = null;
async function loadAgency() {
  SITES = (await rpc("my_sites")).map((x) => toSite(x.site, x.data, x.site.id, { decisions: x.decisions || [] }));
  ORG = await rpc("my_org").catch(() => null);
  // Client accounts (invited by their agency) have no agency sites: they get the reporting view of their own sites.
  CLIENT_SITES = SITES.length ? [] : (await rpc("client_sites").catch(() => [])).map((x) => toSite(x.site, x.data, x.site.id, { brand: x.brand || null, growth: [], growthLoaded: true }));
  loaded = true;
}
async function loadGrowth(s) { if (!s.growthLoaded) { s.growth = await rpc("site_growth", { p_site: s.id }).catch(() => []); s.growthLoaded = true; } }
const shared = new Map();
async function loadShared(t) {
  if (!shared.has(t)) { const j = await rpc("shared_site", { p_token: t }, { anon: true }); shared.set(t, j ? toSite(j.site, j.data, t, { growth: j.growth || [], growthLoaded: true, brand: j.brand || null }) : null); }
  return shared.get(t);
}

/* ---------- Shared bits ---------- */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>',
  report: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 15v-3M12 15V9M16 15v-5"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.6 3.2-5.4 6-5.4s5.2 1.8 6 5.4"/><path d="M16 4.8a3 3 0 0 1 0 6M18.5 14.8c1.4.8 2.2 2.5 2.5 5.2"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v4"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13M7 8l5-5 5 5"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>',
  flow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="14" width="6" height="6" rx="1.5"/><path d="M9 7h4a2 2 0 0 1 2 2v5"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
};
const PAGES = [["overview", "Overview", I.home], ["pipeline", "Live pipeline", I.flow], ["connections", "Connections", I.plug], ["traffic", "Traffic", I.trend], ["keywords", "Keywords", I.key], ["pages", "Pages", I.page], ["locations", "Locations", I.pin], ["plan", "Coming next", I.plan], ["report", "Weekly report", I.report], ["god", "SEO God", I.spark], ["brief", "Business brief", I.page], ["requests", "Requests", I.inbox], ["approvals", "Approvals", I.check], ["team", "SEO team", I.team], ["connect", "Connection", I.plug]];
const AGENCY_ONLY = new Set(["god", "brief", "approvals", "team", "connect", "agent"]); // never shown to clients (D27: reporting only)
const MOBILE_TABS = ["overview", "traffic", "keywords", "pages"];
const ACCOUNT_ONLY = new Set(["pipeline", "connections"]); // need a signed-in agency member or client user: not on anonymous share links
let state = { kwTab: "ranking", kwQ: "", pgFilter: "all", newToken: null };

const last = (s) => s.history[s.history.length - 1] || {};
const first = (s) => s.history[0] || {};
const tone = (v) => (v >= 85 ? "ok" : v >= 70 ? "warn" : "bad");
const isIdx = (p) => /^submitted and indexed$|^indexed, not submitted in sitemap$/i.test(p.indexed || "");
function health(s) {
  const l = last(s), sev = s.audit?.bySeverity || {};
  const idx = l.inspected ? l.indexed / l.inspected : 0;
  const avg = s.pages.length ? s.pages.reduce((a, p) => a + p.score, 0) / s.pages.length : 80;
  return Math.max(0, Math.min(100, Math.round(idx * 45 + avg * 0.55 - (sev.high || 0) * 5)));
}
const posClass = (p) => (p == null ? "p4" : p <= 3 ? "p1" : p <= 10 ? "p2" : p <= 20 ? "p3" : "p4");
const posLabel = (p) => (p == null ? "–" : p <= 3 ? "Top 3" : p <= 10 ? "Page 1" : p <= 20 ? "Page 2" : "Page 3+");
function pct(a, b) { if (!b) return null; return Math.round(((a - b) / b) * 100); }
function change(a, b, invert = false) {
  if (b == null || b === 0) return `<span class="muted">first 28 days</span>`;
  const p = invert ? -pct(a, b) : pct(a, b);
  if (!p) return `<span class="muted">no change</span>`;
  return `<span class="${p > 0 ? "up" : "down"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p)}%</span> <span class="muted">vs previous 28 days</span>`;
}

function chart(points, key, { h = 170, color = "var(--chart)", label = "", fmtY = (v) => fmt(v) } = {}) {
  points = (points || []).filter((p) => p[key] != null);
  if (points.length < 2) return '<div class="empty">Not enough days yet for a chart.</div>';
  const w = 620, pad = { l: 40, r: 10, t: 10, b: 22 };
  const vals = points.map((p) => p[key]);
  const max = Math.max(...vals), min = Math.min(...vals, 0);
  const x = (i) => pad.l + (i * (w - pad.l - pad.r)) / Math.max(points.length - 1, 1);
  const y = (v) => pad.t + (h - pad.t - pad.b) * (1 - (v - min) / (max - min || 1));
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  const n = points.length - 1, id = "g" + key + Math.random().toString(36).slice(2, 6);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[min, (min + max) / 2, max].map((t) => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pad.l - 6}" y="${y(t) + 3}" text-anchor="end">${fmtY(t)}</text>`).join("")}
    <path d="${d}L${x(n)},${h - pad.b}L${x(0)},${h - pad.b}Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n)}" cy="${y(points[n][key])}" r="4.5" fill="${color}"/>
    <text x="${x(0)}" y="${h - 5}">${esc(String(points[0].day).slice(5))}</text><text x="${x(n)}" y="${h - 5}" text-anchor="end">${esc(String(points[n].day).slice(5))}</text>
  </svg>`;
}
function ring(v) {
  const r = 38, c = 2 * Math.PI * r, col = `var(--${tone(v) === "ok" ? "accent" : tone(v)})`;
  return `<div class="ring"><svg viewBox="0 0 92 92" width="92" height="92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="8"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c * v) / 100} ${c}" transform="rotate(-90 46 46)"/></svg><b>${v}</b><small>SEO score</small></div>`;
}
const bars = (rows, total, label = (x) => x.key) => `<div class="list">${rows.map((x) => `<div class="row"><div style="flex:1;min-width:0"><div class="t">${esc(label(x))}</div><div class="bar" style="height:6px;margin-top:6px"><span style="width:${Math.round((x.v / (total || 1)) * 100)}%;background:var(--accent)"></span></div></div><div class="end"><b class="mono">${fmt(x.v)}</b><span class="xs muted">${x.note || ""}</span></div></div>`).join("")}</div>`;

/* ---------- Pages ---------- */
function pOverview(s) {
  const c = s.period.cur, p = s.period.prev, l = last(s), f = first(s), h = health(s);
  const top = s.keywords.slice(0, 5);
  const next = [...s.proposals.map((x) => x.title), ...s.priorities.slice(0, 3).map((x) => x.title)].slice(0, 4);
  return `<div class="card hero">${ring(h)}<div><h1>${esc(s.name)}</h1><p class="lead">${summary(s)}</p></div></div>
  <div class="grid g4">
    ${kpi("Google impressions", c.impressions, change(c.impressions, p.impressions), "Times your pages showed in Google search, last 28 days")}
    ${kpi("Visits from Google", c.clicks, change(c.clicks, p.clicks), "Clicks from Google search to the site")}
    ${kpi("Average position", c.position, change(c.position, p.position, true), "Where you appear on average. Lower is better; 1–10 is page one")}
    ${kpi("Pages in Google", `${fmt(l.indexed)}<small> / ${fmt(l.inspected)}</small>`, l.indexed > f.indexed ? `<span class="up">▲ ${l.indexed - f.indexed}</span> <span class="muted">since ${esc(String(f.day).slice(5))}</span>` : "", "Pages Google has indexed and can show")}
  </div>
  <div class="grid g2">
    <div class="card"><div class="ch"><h2>Daily impressions</h2><p>How often Google shows the site</p></div>${chart(s.history, "impressions", { label: "Daily impressions" })}</div>
    <div class="card pad0"><div class="ch"><h2>Top keywords</h2><a class="r btn" href="${link(s, "keywords")}">All keywords</a></div><div class="list">${top.map(kwRow).join("") || '<div class="empty">No searches yet.</div>'}</div></div>
  </div>
  <div class="grid g2">
    <div class="card pad0"><div class="ch"><h2>Coming next</h2><a class="r btn" href="${link(s, "plan")}">Plan</a></div><div class="list">${next.map((t) => `<div class="row"><div><div class="t">${esc(t)}</div></div><span class="pill info">Planned</span></div>`).join("") || '<div class="empty">Nothing planned yet.</div>'}</div></div>
    <div class="card"><div class="ch"><h2>Where visitors come from</h2></div>${sourcesBlock(s)}</div>
  </div>
  ${aboutCard(s)}
  ${growthCard(s)}`;
}
// Growth across stored daily snapshots: the average page score and the searches the site shows up for.
function growthCard(s) {
  const g = (s.growth || []).map((r) => ({ ...r, day: String(r.at).slice(0, 10) }));
  if (g.length < 2) return `<div class="card"><div class="ch"><h2>Growth over time</h2><p>Builds up from the daily snapshots</p></div><div class="empty">${g.length ? "One snapshot so far. The trend appears after the second day." : "The trend appears after the first daily snapshots."}</div></div>`;
  const a = g[0], b = g[g.length - 1], d = (k) => (b[k] ?? 0) - (a[k] ?? 0);
  const sign = (n, dp = 0) => (n > 0 ? `<span class="up">▲ ${fmt(n, dp)}</span>` : n < 0 ? `<span class="down">▼ ${fmt(-n, dp)}</span>` : `<span class="muted">no change</span>`);
  return `<div class="card"><div class="ch"><h2>Growth over time</h2><p>${g.length} daily snapshots since ${esc(a.day)}</p></div>
    <div class="grid g3" style="margin-bottom:12px">${kpi("Average page score", b.score, sign(d("score"), 1) + " since start", "Higher is better")}${kpi("Searches you appear for", b.keywords, sign(d("keywords")) + " since start", "Top 80 kept")}${kpi("Pages in Google", b.indexed, sign(d("indexed")) + " since start", "Pages indexed")}</div>
    <div class="grid g2"><div>${chart(g, "score", { label: "Average page score", fmtY: (v) => fmt(v, 0) })}</div><div>${chart(g, "keywords", { label: "Searches the site appears for", color: "var(--info)" })}</div></div></div>`;
}
function summary(s) {
  const c = s.period.cur, l = last(s);
  const bits = [`Google showed the site <b>${fmt(c.impressions)}</b> times in the last 28 days for <b>${fmt(c.queries)}</b> different searches`];
  bits.push(c.clicks ? `bringing <b>${fmt(c.clicks)}</b> visits` : `with no clicks yet: most pages still rank beyond page one`);
  if (l.inspected) bits.push(`<b>${fmt(l.indexed)}</b> of ${fmt(l.inspected)} pages are in Google`);
  if (s.ga4 && !s.ga4.error) bits.push(`and <b>${fmt(s.ga4.sessions)}</b> visits in all (Google Analytics)`);
  return bits.join(", ") + ".";
}
function kpi(label, v, delta, help) {
  return `<div class="card kpi"><div class="l">${label}</div><div class="v">${typeof v === "number" ? fmt(v, 1) : v ?? "–"}</div><div class="d">${delta || "&nbsp;"}</div><div class="help">${help}</div></div>`;
}
const CHANNEL = { "Organic Search": "Google and other search", Direct: "Direct (typed or bookmarked)", Referral: "Links on other sites", "Organic Social": "Social media", "Paid Search": "Search ads", Email: "Email", Unassigned: "Not known" };
function sourcesBlock(s) {
  const g = s.ga4;
  if (g && !g.error && g.channels?.length) {
    const tot = g.channels.reduce((a, x) => a + x.sessions, 0);

function md(t) {
  const out = []; let list = false;
  for (const raw of String(t || "").split("\n")) {
    const line = raw.trim();
    const inline = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
    if (/^- /.test(line)) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(line.slice(2))}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    if (/^#{2,3} /.test(line)) out.push(`<h3>${inline(line.replace(/^#+ /, ""))}</h3>`);
    else if (/^# /.test(line)) continue;
    else if (line) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

}

      <p class="xs muted" style="margin:0 0 8px">Only platform admins see this. ${c.paused ? `Paused${c.reason ? `: ${esc(c.reason)}` : ""}${c.by ? ` by ${esc(c.by)}` : ""}.` : ""} Last run ${esc(ago(h.lastRunAt))}. ${fmt(h.sites)} websites, ${fmt(h.pausedSites)} paused.</p>
      <div class="grid g4">${kpi("Runs (24 h)", fmt(u.runs), null, `${fmt(u.runsWithErrors)} with errors`)}${kpi("Worker requests (24 h)", fmt(u.invocations), null, `${pct}% of the 100,000 a day on Workers Free`)}${kpi("Outbound requests", fmt(u.subrequests), null, "Database, scans, AI provider")}${kpi("Jobs run", fmt(u.jobsRun), null, `${fmt(u.jobsRecovered)} recovered after a stop`)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${c.paused ? '<button class="btn primary" id="ops-resume">Resume the scheduler</button>' : '<button class="btn" id="ops-pause">Pause the scheduler</button>'}</div>
      <details style="margin-top:10px"><summary class="xs" style="cursor:pointer">Recent runs</summary><div class="list">${(h.runs || []).map((r) => `<div class="row"><div><div class="t">${esc(String(r.started_at).slice(0, 16).replace("T", " "))} · ${esc(r.runner)}</div><div class="s">${fmt(r.sites_planned)} sites planned · ${fmt(r.jobs_run)} jobs · ${fmt(r.invocations)} invocations · ${fmt(r.subrequests)} requests${r.paused ? " · paused" : ""}${(r.errors || []).length ? ` · <span style="color:var(--bad,#c33)">${esc(r.errors.join("; "))}</span>` : ""}</div></div></div>`).join("") || '<div class="empty">No runs yet.</div>'}</div></details></div>`;
  }
  // Search Console (D34, D47): the shared Google account reads a website only after a platform admin confirms it.
  if (Array.isArray(OPS?.gsc)) html += `<div class="card pad0"><div class="ch"><h2>Search Console access</h2><p>Platform admins only</p></div>
    <p class="xs muted" style="margin:0;padding:0 16px 8px">Confirm only websites whose owner added the scanning Google account as a user in Search Console. The agents then read 28 days of clicks and impressions every day.</p>
    <div class="list">${OPS.gsc.map((x) => `<div class="row" style="flex-wrap:wrap;gap:8px"><div style="flex:1;min-width:200px"><div class="t">${esc(x.name)}</div><div class="s">${esc(host(x.url))} · ${esc(x.agency || "")}${x.status === "paused" ? " · paused" : ""}</div></div>
      ${x.conflict ? '<span class="pill bad"><i></i>Also registered in another agency</span>' : x.allowed ? `<span class="pill ok"><i></i>Confirmed ${esc(String(x.allowedAt || "").slice(0, 10))}</span><button class="btn" data-gsc="${esc(x.id)}" data-on="0">Revoke</button>` : '<span class="pill"><i></i>Not confirmed</span>' + `<button class="btn primary" data-gsc="${esc(x.id)}" data-on="1">Confirm</button>`}</div>`).join("") || '<div class="empty">No websites yet.</div>'}</div></div>`;
  return html;
}

// What needs a person (D50): the scheduler's heartbeat and, per website, long waits, stuck work, budget hits, plan errors.
const ALERT_TEXT = {
  scheduler_silent: (a) => `The scheduler has not run since ${a.since ? esc(ago(a.since)) : "it was set up"}. Check the Worker in Cloudflare.`,
  scheduler_errors: () => "Three of the scheduler's last four runs reported errors. Operations → Recent runs shows them to platform admins.",
  waiting_long: (a) => `${esc(a.siteName)}: ${fmt(a.count)} item${a.count === 1 ? "" : "s"} waiting for your decision for more than 3 days.`,
  escalated: (a) => `${esc(a.siteName)}: ${fmt(a.count)} job${a.count === 1 ? "" : "s"} stopped and need${a.count === 1 ? "s" : ""} a person.`,
  budget_hit: (a) => `${esc(a.siteName)}: today's AI budget${a.budgetUsd != null ? ` (${usd(a.budgetUsd)})` : ""} is used up; ${fmt(a.count)} job${a.count === 1 ? "" : "s"} wait until tomorrow.`,
  plan_error: (a) => `${esc(a.siteName)}: the last planning run failed: ${esc(a.error || "")}`,
};
function alertsCard(list) {
  if (!Array.isArray(list)) return "";
  if (!list.length) return '<div class="card"><div class="ch"><h2>Alerts</h2><span class="pill ok"><i></i>Nothing needs you</span></div></div>';
  return `<div class="card pad0"><div class="ch"><h2>Alerts</h2><p>${fmt(list.length)}</p></div><div class="list">${list.map((a) => `<div class="row"><span class="pill ${a.level === "bad" ? "bad" : a.level === "warn" ? "warn" : "info"}"><i></i>${a.level === "bad" ? "Act now" : a.level === "warn" ? "Waiting" : "Note"}</span><div style="flex:1;min-width:0">${(ALERT_TEXT[a.kind] || (() => esc(a.kind)))(a)}</div>${a.site ? `<a class="btn" href="#/s/${esc(a.site)}/god">Open</a>` : ""}</div>`).join("")}</div></div>`;
}

/* ---------- Live pipeline and connections (D54): agency and signed-in clients; never share links ---------- */
// Clients see status, names and times only (the RPC leaves out costs, budgets, repositories and notes).
const STATUS_TEXT = { proposed: "Planned", scoped: "Planned", queued: "Queued", running: "Working", awaiting_review: "Being checked", authorized: "Approved, running",
  awaiting_approval: "Waiting for a decision", escalated: "Stopped: needs a person", completed: "Done", failed: "Failed", rejected: "Declined", cancelled: "Cancelled" };
const STATUS_TONE = { queued: "busy", running: "busy", awaiting_review: "busy", authorized: "busy", awaiting_approval: "warn", escalated: "bad", failed: "bad", completed: "ok" };
const CONN_TEXT = { connected: "Connected", waiting: "Waiting", missing: "Not connected", error: "Needs attention", off: "Off" };
const CONN_TONE = { connected: "ok", waiting: "busy", missing: "warn", error: "bad", off: "" };
const until = (t) => { const m = Math.round((Date.parse(t) - Date.now()) / 60000); return m <= 0 ? "due now" : m < 60 ? `in ${m} min` : `in ${Math.round(m / 60)} h`; };
const workName = (x) => (x.agent ? agentLabel(x.agent) : KIND_NAME[x.kind] || String(x.kind || "work").replace(/_/g, " "));
async function loadPipeline(s) { [s.pipe, s.google] = await Promise.all([rpc("site_pipeline", { p_site: s.id }), rpc("site_google", { p_site: s.id }).catch(() => s.google ?? null)]); }

function pipeStations(p) {
  const C = Object.fromEntries((p.connections || []).map((c) => [c.key, c])), n = p.counts || {}, sc = p.schedule || {};
  const live = (p.connections || []).filter((c) => c.state !== "off");
  const okSources = live.filter((c) => c.state === "connected").length;
  const fresh = sc.lastRun && Date.now() - Date.parse(sc.lastRun) < 40 * 60000;
  return [
    { key: "sources", name: "Data sources", ic: I.plug, tone: okSources === live.length ? "ok" : okSources ? "warn" : "bad", num: `${okSources}/${live.length}`, sub: "connected" },
    { key: "scan", name: "Website scan", ic: I.page, tone: CONN_TONE[C.scan?.state] || "", num: C.scan?.at ? ago(C.scan.at).replace(" ago", "") : "–", sub: C.scan?.at ? "since the last scan" : CONN_TEXT[C.scan?.state] || "" },
    { key: "director", name: "SEO director", ic: I.spark, tone: sc.paused ? "off" : !fresh ? "bad" : n.active ? "busy" : "ok", num: sc.paused ? "Paused" : sc.lastPlanned ? ago(sc.lastPlanned).replace(" ago", "") : "–",
      sub: sc.paused ? "no new work" : `since planning; strategy ${esc(sc.strategy || "not drafted")}` },
    { key: "agents", name: "Specialists", ic: I.team, tone: n.active ? "busy" : (p.agents || []).length ? "ok" : "", num: fmt(n.active || 0), sub: `working now · ${fmt((p.agents || []).length)} have worked here` },
    { key: "checks", name: "Quality checks", ic: I.check, tone: n.reviews30 ? (n.passed30 === n.reviews30 ? "ok" : "warn") : "", num: `${fmt(n.passed30 || 0)}/${fmt(n.reviews30 || 0)}`, sub: "passed in 30 days" },
    { key: "decisions", name: "Decisions and results", ic: I.inbox, tone: n.stopped ? "bad" : n.waiting ? "warn" : "ok", num: fmt(n.done30 || 0), sub: `done in 30 days · ${fmt(n.waiting || 0)} waiting${n.stopped ? ` · ${fmt(n.stopped)} stopped` : ""}` },
  ];
}

function pPipeline(s) {
  const p = s.pipe;
  if (!p) return '<div class="empty">Loading…</div>';
  const sc = p.schedule || {}, st = pipeStations(p);
  const fresh = sc.lastRun && Date.now() - Date.parse(sc.lastRun) < 40 * 60000;
  const head = `<div><h1>Live pipeline</h1><p class="lead">How work on ${esc(host(s.url))} flows: data comes in, the SEO director plans, specialists work, every result is checked, and ${p.agency ? "you decide" : "your SEO team decides"} what goes ahead. It refreshes by itself.</p></div>
    <div class="pipe-head"><span class="pill ${sc.paused ? "warn" : fresh ? "ok" : "bad"}"><i></i>${sc.paused ? "Paused" : fresh ? `Running every ${sc.everyMinutes} min` : "Scheduler silent"}</span>
      <span class="pill">Last run ${esc(ago(sc.lastRun))}</span>${sc.nextPlan && !sc.paused ? `<span class="pill">Next plan ${esc(until(sc.nextPlan))}</span>` : ""}
      ${p.agency && sc.budgetUsd != null ? `<span class="pill">${usd(sc.spentTodayUsd)} of ${usd(sc.budgetUsd)} today</span>` : ""}</div>`;
  const board = `<div class="pipe-stage"><div class="pipe-board" role="list">${st.map((x, i) => `<button class="pnode ${x.tone}" role="listitem" data-node="${x.key}" aria-label="${esc(x.name)}: open details">
      <span class="ic">${x.ic}</span><b>${esc(x.name)}</b><span class="num">${x.num}</span><span class="sub">${x.sub}</span>
      ${i < st.length - 1 ? `<span class="pflow ${!sc.paused && fresh && x.tone !== "off" ? "on" : ""}" aria-hidden="true"></span>` : ""}</button>`).join("")}</div></div>`;
  const agents = (p.agents || []).length ? `<div class="agent-grid">${p.agents.map((a) => `<${p.agency ? `a href="${link(s, "agent")}/${esc(a.agent)}"` : "div"} class="agent-card">
      <span class="t"><span class="dotlive ${STATUS_TONE[a.status] || ""}"></span>${esc(agentLabel(a.agent))}</span>
      <span class="xs muted">${esc(STATUS_TEXT[a.status] || a.status)} · ${esc(ago(a.at))}</span><span class="xs">${esc(a.title || "")}</span>
      <span class="xs muted">${fmt(a.runs30)} run${a.runs30 === 1 ? "" : "s"} in 30 days</span></${p.agency ? "a" : "div"}>`).join("")}</div>` : '<div class="empty">No specialist has worked on this website yet.</div>';
  return `${head}${board}
    <div class="grid g2"><div class="card"><div class="ch"><h2>Specialists</h2><p>${fmt((p.agents || []).length)}</p></div>${agents}</div>
    <div class="card pad0"><div class="ch"><h2>Live activity</h2><p>latest steps</p></div><div class="list feed" id="pipe-feed">${pipeFeed(p)}</div></div></div>`;
}
const pipeFeed = (p) => (p.events || []).map((e) => `<div class="row"><span class="dotlive ${STATUS_TONE[e.to] || ""}" style="margin-top:7px"></span><div style="flex:1;min-width:0">
    <div class="t"><span style="text-transform:capitalize">${esc(workName(e))}</span>: ${esc(STATUS_TEXT[e.to] || e.to || "update")}</div><div class="s">${esc(e.title || "")}${e.note ? ` · ${esc(e.note)}` : ""}</div></div>
    <span class="xs muted">${esc(ago(e.at))}</span></div>`).join("") || '<div class="empty">No activity yet.</div>';

function pipeDetail(s, key) {
  const p = s.pipe, n = p.counts || {}, sc = p.schedule || {};
  const conns = (list) => list.map((c) => `<div class="row"><span class="dotlive ${CONN_TONE[c.state]}" style="margin-top:7px"></span><div style="flex:1;min-width:0"><div class="t">${esc(c.name)} · ${esc(CONN_TEXT[c.state] || c.state)}</div><div class="s">${esc(c.detail || "")}</div></div><span class="xs muted">${c.at ? esc(ago(c.at)) : ""}</span></div>`).join("");
  const items = (list) => list.map((x) => `<div class="row"><span class="dotlive ${STATUS_TONE[x.status] || ""}" style="margin-top:7px"></span><div style="flex:1;min-width:0"><div class="t" style="text-transform:capitalize">${esc(workName(x))}</div><div class="s">${esc(x.title || "")} · ${esc(STATUS_TEXT[x.status] || x.status)}</div></div><span class="xs muted">${esc(ago(x.at))}</span></div>`).join("") || '<div class="empty">Nothing here right now.</div>';
  const live = p.live || [];
  const body = {
    sources: [`Data sources`, conns(p.connections || []), `<a class="btn" href="${link(s, "connections")}">${I.plug}All connections</a>`],
    scan: [`Website scan`, conns((p.connections || []).filter((c) => c.key === "scan")) + '<p class="xs muted">The scan reads every page: titles, descriptions, links, speed and structured data. The specialists start from it.</p>', `<a class="btn" href="${link(s, "pages")}">${I.page}Pages</a>`],
    director: [`SEO director`, `<div class="list"><div class="row"><div class="t">Strategy</div><span class="end">${esc(sc.strategy || "not drafted yet")}</span></div><div class="row"><div class="t">Last planned</div><span class="end">${esc(ago(sc.lastPlanned))}</span></div><div class="row"><div class="t">Scheduler</div><span class="end">${sc.paused ? "paused" : `every ${sc.everyMinutes} min, last ${esc(ago(sc.lastRun))}`}</span></div></div><p class="xs muted">The director reads everything known about the website, plans the next work and hands it to the specialists. It plans each website every few hours, sooner when approved work is waiting.</p>`, p.agency ? `<a class="btn" href="${link(s, "god")}">${I.spark}SEO God page</a>` : ""],
    agents: [`Specialists at work`, items(live.filter((x) => ["queued", "running", "awaiting_review", "authorized"].includes(x.status))), p.agency ? `<a class="btn" href="${link(s, "team")}">${I.team}SEO team</a>` : ""],
    checks: [`Quality checks`, `<p>Every specialist's result is checked before anyone sees it: an automatic quality gate, and for content and high-risk work a second agent that checks every claim against the data.</p><div class="list"><div class="row"><div class="t">Checks in the last 30 days</div><span class="end">${fmt(n.reviews30 || 0)}</span></div><div class="row"><div class="t">Passed</div><span class="end">${fmt(n.passed30 || 0)}</span></div></div>`, ""],
    decisions: [`Decisions and results`, items(live.filter((x) => ["awaiting_approval", "escalated"].includes(x.status))) + `<p class="xs muted">${fmt(n.done30 || 0)} pieces of work finished in the last 30 days. Nothing changes on the website without a person's approval.</p>`, p.agency ? `<a class="btn primary" href="${link(s, "god")}">${I.check}Decide on the SEO God page</a>` : `<a class="btn" href="${link(s, "report")}">${I.report}Weekly report</a>`],
  }[key];
  if (!body) return;
  $("#overlay").innerHTML = `<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-label="${esc(body[0])}" style="max-width:720px;margin:0 auto;max-height:80vh;overflow:auto"><div class="grab"></div><h2 style="margin:4px 4px 10px">${esc(body[0])}</h2><div class="list">${body[1]}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${body[2]}<button class="btn" id="sheet-close">Close</button></div></div></div>`;
  $("#sheet").onclick = (e) => { if (e.target.id === "sheet" || e.target.id === "sheet-close" || e.target.closest("a")) $("#overlay").innerHTML = ""; };
}

function pConnections(s) {
  const p = s.pipe;
  if (!p) return '<div class="empty">Loading…</div>';
  const how = {
    github: p.agency ? `In the repository ${esc(p.site.repo || "")}: Settings › Secrets and variables › Actions, add <code>SEO_PORTAL_URL</code> and <code>SEO_PORTAL_TOKEN</code> from the <a href="${link(s, "connect")}">Connection page</a>. The next daily run sends Search Console, keywords, indexing and IndexNow results here, and the agents use them.` : "",
    search_console: p.agency ? "Press <b>Connect with Google</b> in Set up above. (Older ways, under Advanced: the daily GitHub run with the website's own key, or the shared service account confirmed on Operations.)" : "",
    scan: "", agents: "",
  };
  const list = p.connections || [];
