# SEO God execution Worker (D30). Setup, secrets and deploy steps: README.md in this folder.
# Secrets are never written here. Set them with `npx wrangler secret put <NAME>`:
#   SUPABASE_SERVICE_ROLE_KEY  INTERNAL_TOKEN  SCAN_SECRET  ANTHROPIC_API_KEY (optional, the user's own key)
#   GOOGLE_KEY_JSON (shared service account: Search Console and GA4 reads)  PAGESPEED_API_KEY (central speed checks, D56)
#   Setup: docs/hosted-google-access.md
name = "seo-god"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "node build.mjs"

# One Cron Trigger (Workers Free allows 5 per account). Every 15 minutes: 96 runs a day.
[triggers]
crons = ["*/15 * * * *"]

# Each site's planning and each job run in their own invocation of this Worker (own 10 ms CPU, own 50 requests).
[[services]]
binding = "SELF"
service = "seo-god"

[observability]
enabled = true

[vars]
# Fails safe: the scheduler does nothing until this is the string "false". The database switch
# (public.set_god_paused) also pauses it without a deploy.
SEO_GOD_PAUSED = "true"
SUPABASE_URL = "https://ymwwwhdlyjnqbxxhtcew.supabase.co"
SCAN_FUNCTION_URL = "https://ymwwwhdlyjnqbxxhtcew.supabase.co/functions/v1/scan"
NOTIFY_FUNCTION_URL = "https://ymwwwhdlyjnqbxxhtcew.supabase.co/functions/v1/notify"
SITES_PER_RUN = "5"
JOBS_PER_RUN = "4"
SITE_MIN_AGE_HOURS = "6"
SCAN_MAX_PAGES = "40"
# Per site per day. 0 = free read-only work only (scans, planning, strategy drafts); agent advice needs a budget.
SEO_GOD_DAILY_BUDGET_USD = "2"
SEO_GOD_AGENT_RUN_USD = "0.5"
SEO_GOD_MODEL = "claude-opus-5-5"
SEO_GOD_EFFORT = "medium"
# D56: the only origin allowed to call /google/account and /google/check from a browser.
PORTAL_URL = "https://seo.erudience.com/"
# The portal's PUBLISHABLE key (public, not a secret): "Check access" calls the database as the signed-in user with it.
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tyjs1Xduxa_w5ASX_BfxIw_4OrfZ6xC"
SPEED_MAX_PAGES = "4"

# Staging: `npx wrangler deploy --env staging` (separate Worker, separate secrets; point it at a Supabase branch or a test project).
[env.staging]
name = "seo-god-staging"
[env.staging.triggers]
crons = []
[[env.staging.services]]
binding = "SELF"
service = "seo-god-staging"
[env.staging.vars]
SEO_GOD_PAUSED = "true"
SUPABASE_URL = ""
SCAN_FUNCTION_URL = ""
NOTIFY_FUNCTION_URL = ""
SITES_PER_RUN = "2"
JOBS_PER_RUN = "2"
SITE_MIN_AGE_HOURS = "1"
SCAN_MAX_PAGES = "20"
SEO_GOD_DAILY_BUDGET_USD = "0"
SEO_GOD_AGENT_RUN_USD = "0.25"
SEO_GOD_MODEL = "claude-haiku-5-5"
SEO_GOD_EFFORT = "low"
PORTAL_URL = ""
SUPABASE_PUBLISHABLE_KEY = ""
SPEED_MAX_PAGES = "2"
