<style>
  :root { --bg:#f6f1e9; --card:#fffdf9; --ink:#14120e; --soft:#5b574d; --line:#e3dccf; --green:#0a6e3e; --bad:#b42318; --warn:#b54708; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1511; --card:#161e19; --ink:#f3efe7; --soft:#a9b3ab; --line:#27332c; --green:#3ddc97; --bad:#ff8a80; --warn:#ffb86b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; } h2 { font-size:17px; margin:32px 0 10px; } .sub { color:var(--soft); margin:0 0 20px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .num { font-size:28px; font-weight:800; line-height:1.1; } .lbl { color:var(--soft); font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; }
  .tbl { overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); }
  table { width:100%; border-collapse:collapse; font-size:14px; } th { text-align:left; font-size:12px; text-transform:uppercase; color:var(--green); padding:9px 12px; }
  td { padding:9px 12px; border-top:1px solid var(--line); vertical-align:top; } a { color:var(--green); }
  .pill { display:inline-block; padding:1px 9px; border-radius:99px; border:1px solid var(--line); font-size:12.5px; }
  .ok { color:var(--green); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  pre { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font:13.5px/1.55 inherit; margin:0; }
  svg { width:100%; height:160px; display:block; } .muted { color:var(--soft); }
  .bar { display:flex; height:14px; border-radius:99px; overflow:hidden; background:var(--line); margin:8px 0; } .bar i { display:block; }
</style>

ect through a chain","type":"audit","score":38,"effort":"S","confidence":"high","why":"Each extra hop slows crawling and can dilute signals. Crawlers may stop after several hops.","how":"Redirect straight to the final URL in one step.","evidence":["3 sample pages with 2 hops each"]},{"rank":2,"title":"Rewrite the title and description of 'crm for small teams' (position 11.4)","type":"striking-distance","score":24,"effort":"S","confidence":"medium","why":"The page already ranks near the first page; a clearer snippet is the cheapest way to earn more of the impressions it gets.","how":"Lead with the query, state what the reader gets, log the change in the experiments file.","evidence":["33 impressions, average position 11.4","estimated 4 extra clicks a month (from this site's own click-through data)"]},{"rank":3,"title":"Two pages compete for 'crm migration checklist'","type":"cannibalization","score":19,"effort":"M","confidence":"medium","why":"When two of your pages target one query they split the signals and neither ranks as well as one stronger page would.","how":"Pick the stronger page, merge the useful parts of the other into it, and redirect the weaker URL.","evidence":["/guides/crm-migration and /blog/crm-data-migration-checklist both appear for it"]},{"rank":4,"title":"Allow AI search crawlers that are currently blocked","type":"ai-search","score":17,"effort":"S","confidence":"low","why":"Blocked crawlers cannot fetch your pages to answer a user's question, so you cannot be cited by those products.","how":"Allow these in robots.txt unless blocking is a deliberate choice.","evidence":["PerplexityBot (Perplexity)"]}],"audit":{"generatedAt":"sample","summary":{"pagesCrawled":86,"bySeverity":{"high":1,"medium":4,"low":9}},"opportunities":[],"rules":[{"rule":"canonical-broken","severity":"high","title":"Canonical target is not a healthy page","why":"A canonical pointing at a redirect, error or noindex page sends contradictory signals.","fix":"Point the canonical at const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (u) => esc(String(u).replace(D.site.url, "/"));
const table = (head, rows, empty) => rows.length ? `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="muted">${esc(empty)}</p>`;
const link = (u) => `https://search.google.com/search-console/inspect?resource_id=${encodeURIComponent(D.site.property)}&id=${encodeURIComponent(u)}`;

function chart(rows, key, color) {
  if (rows.length < 2) return `<p class="muted">The chart appears after two days of data.</p>`;
  const w = 600, h = 140, max = Math.max(...rows.map((r) => r[key]), 1);
  const pts = rows.map((r, i) => `${(i / (rows.length - 1)) * w},${h - (r[key] / max) * (h - 8) - 4}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts}"/></svg><div class="muted">${esc(rows[0].day)} to ${esc(rows.at(-1).day)}, peak ${max}</div>`;
}

function render() {
  const H = D.history, last = H.at(-1), insp = Object.entries(D.inspect);
  const by = {}; insp.forEach(([, v]) => { by[v.coverage || "unknown"] = (by[v.coverage || "unknown"] || 0) + 1; });

    ${P.tracked ? `<div class="card"><div class="num">${P.upcoming}</div><div class="lbl">Scheduled to publish</div></div><div class="card"><div class="num">${P.queued}</div><div class="lbl">Approved, not yet scheduled</div></div>` : ""}
  </div>

  <h2>Clicks and impressions over time</h2>
  <div class="grid"><div class="card"><div class="lbl">Clicks</div>${chart(H, "clicks", "#0a6e3e")}</div><div class="card"><div class="lbl">Impressions</div>${chart(H, "impressions", "#2563eb")}</div></div>

  <h2>Index status</h2>
  <div class="card"><div class="bar">${bar}</div>${Object.entries(by).map(([k, n]) => `<span class="pill">${esc(k)}: ${n}</span> `).join("")}</div>

  ${D.priorities && D.priorities.length ? `<h2>Priorities (ranked by impact × confidence ÷ effort)</h2>${D.priorities.slice(0, 12).map((i) => `<details class="card" style="margin:8px 0"><summary><b>${i.rank}. ${esc(i.title)}</b> <span class="pill">${esc(i.type)}</span> <span class="muted">score ${i.score} · effort ${esc(i.effort)} · confidence ${esc(i.confidence)}</span></summary><p><b>Why:</b> ${esc(i.why)}</p><p><b>What to do:</b> ${esc(i.how)}</p><ul>${i.evidence.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></details>`).join("")}` : ""}

  ${D.audit ? `<h2>Technical audit</h2><div class="grid"><div class="card"><div class="num">${D.audit.summary.pagesCrawled}</div><div class="lbl">Pages crawled</div></div><div class="card"><div class="num bad">${D.audit.summary.bySeverity.high}</div><div class="lbl">High</div></div><div class="card"><div class="num warn">${D.audit.summary.bySeverity.medium}</div><div class="lbl">Medium</div></div><div class="card"><div class="num">${D.audit.summary.bySeverity.low}</div><div class="lbl">Low</div></div></div>${D.audit.rules.slice(0, 12).map((r) => `<details class="card" style="margin:8px 0"><summary><span class="pill">${esc(r.severity)}</span> <b>${esc(r.title)}</b> (${r.count})</summary><p><b>Why it matters:</b> ${esc(r.why)}</p><p><b>How to fix:</b> ${esc(r.fix)}</p><ul>${r.examples.map((x) => `<li>${short(x.url)}${x.detail ? ` <span class="muted">(${esc(x.detail)})</span>` : ""}</li>`).join("")}</ul></details>`).join("") || `<p class="ok">No issues found.</p>`}` : ""}

  ${D.insights ? `<h2>Search insights</h2><div class="grid"><div class="card"><div class="num">${D.insights.brand.nonBrand.impressions}</div><div class="lbl">Non-brand impressions</div></div><div class="card"><div class="num">${D.insights.brand.brand.impressions}</div><div class="lbl">Brand impressions</div></div></div><h3>Striking distance (positions 4 to 20)</h3>${table(["Query", "Pos.", "Impr.", "Page", "Est. extra clicks"], D.insights.strikingDistance.slice(0, 12).map((x) => [esc(x.query), x.position, x.impressions, short(x.page), x.estimatedExtraClicks ?? "–"]), "None yet.")}<h3>Pages competing for the same query</h3>${table(["Query", "Impr.", "Pages"], D.insights.cannibalization.slice(0, 10).map((c) => [esc(c.query), c.impressions, c.pages.map((p) => short(p.page) + " (pos " + p.position + ")").join("<br>")]), "None found.")}<h3>Topics with demand and no dedicated page</h3>${table(["Topic", "Impr.", "Queries"], D.insights.contentGaps.slice(0, 10).map((t) => [esc(t.topic), t.impressions, t.queries]), "None found.")}` : ""}

  ${D.geo ? `<h2>AI search readiness</h2><p class="muted">Practices that tend to help being found and cited by AI search, not guarantees. ${D.geo.pages.length} pages sampled.</p>${table(["Crawler", "Purpose", "Access"], D.geo.robots.map((b) => [esc(b.name + " (" + b.owner + ")"), esc(b.purpose), `<span class="${b.blocked ? "bad" : "ok"}">${esc(b.state)}</span>`]), "")}${D.geo.findings.map((x) => `<details class="card" style="margin:8px 0"><summary><span class="pill">${esc(x.severity)}</span> <b>${esc(x.title)}</b></summary><p><b>Why:</b> ${esc(x.why)}</p><p><b>Fix:</b> ${esc(x.fix)}</p></details>`).join("") || `<p class="ok">Nothing to flag.</p>`}` : ""}

  ${D.speed ? `<h2>Speed (Core Web Vitals)</h2>${table(["Page", "Score", "LCP lab", "LCP users", "INP users"], D.speed.results.map((r) => r.error ? [short(r.url), "", "", "", esc(r.error)] : [short(r.url), r.lab.score, r.lab.lcp == null ? "–" : Math.round(r.lab.lcp) + " ms", r.field.lcp == null ? "no data" : r.field.lcp + " ms", r.field.inp == null ? "no data" : r.field.inp + " ms"]), "No results.")}` : ""}

  <h2>Pages to request indexing for (do these by hand)</h2>
  ${table(["Page", "Status", "Action"], insp.filter(([, v]) => v.coverage && v.coverage !== "Submitted and indexed" && !/redirect|alternate|duplicate/i.test(v.coverage)).sort((a, b) => (/unknown/i.test(b[1].coverage) ? 1 : 0) - (/unknown/i.test(a[1].coverage) ? 1 : 0)).slice(0, 25).map(([u, v]) => [short(u), esc(v.coverage), `<a target="_blank" rel="noopener" href="${esc(link(u))}">Open in Search Console</a>`]), "Every inspected page is indexed or needs a fix, not a request.")}

  ${P.tracked ? `<h2>Content schedule</h2>${table(["Date", "Page"], P.schedule.slice(0, 40).map((s) => [esc(s.date), s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>` : esc(s.title)]), "Nothing is scheduled. Approve topic proposals to fill the schedule.")}` : ""}

  <h2>Keyword and topic backlog</h2>
  ${table(["Query", "Type", "Impr.", "Position", "Status"], Object.values(D.backlog).sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 40).map((b) => [esc(b.query) + (b.unverified ? ' <span class="pill">idea, no data</span>' : ""), esc((b.kinds || []).join(", ")), b.impressions ?? "", b.position ?? "", esc(b.status)]), "Run the weekly research job to fill this.")}

  <h2>Backlink listings</h2>
  ${table(["Target", "Mode", "Status", "Tries", "Note"], D.backlinks.map((r) => [`<a href="${esc(r.submit_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`, esc(r.mode), `<span class="${r.status === "failed" ? "bad" : r.status === "submitted" || r.status === "done" ? "ok" : "warn"}">${esc(r.status)}</span>`, r.attempts, esc(r.note)]), "No backlink targets configured.")}

  <h2>Latest weekly digest</h2><pre>${esc(D.digest || "The weekly job has not run yet.")}</pre>
  <h2>News and trends</h2><pre>${esc(D.news || "The daily job has not run yet.")}</pre>
  `;
}
render();
</script>
</body>
</html>
