[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-engine"
version = "0.1.0"
description = "Python engine for seo-autopilot: query clustering, anomaly detection and the tool-using agent runtime."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed to run the agents. The clustering and anomaly code uses the standard library alone.
agent = ["claude-agent-sdk>=0.2.100"]

[tool.setuptools]
packages = ["seo_engine"]
