<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEO dashboard</title>
<style>
  :root { --bg:#f6f1e9; --card:#fffdf9; --ink:#14120e; --soft:#5b574d; --line:#e3dccf; --green:#0a6e3e; --bad:#b42318; --warn:#b54708; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1511; --card:#161e19; --ink:#f3efe7; --soft:#a9b3ab; --line:#27332c; --green:#3ddc97; --bad:#ff8a80; --warn:#ffb86b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; } h2 { font-size:17px; margin:32px 0 10px; } .sub { color:var(--soft); margin:0 0 20px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .num { font-size:28px; font-weight:800; line-height:1.1; } .lbl { color:var(--soft); font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; }
  .tbl { overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); }
  table { width:100%; border-collapse:collapse; font-size:14px; } th { text-align:left; font-size:12px; text-transform:uppercase; color:var(--green); padding:9px 12px; }
  td { padding:9px 12px; border-top:1px solid var(--line); vertical-align:top; } a { color:var(--green); }
  .pill { display:inline-block; padding:1px 9px; border-radius:99px; border:1px solid var(--line); font-size:12.5px; }
  .ok { color:var(--green); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  pre { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font:13.5px/1.55 inherit; margin:0; }
  svg { width:100%; height:160px; display:block; } .muted { color:var(--soft); }
  .bar { display:flex; height:14px; border-radius:99px; overflow:hidden; background:var(--line); margin:8px 0; } .bar i { display:block; }
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
const D = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (u) => esc(String(u).replace(D.site.url, "/"));
const table = (head, rows, empty) => rows.length ? `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="muted">${esc(empty)}</p>`;
const link = (u) => `https://search.google.com/search-console/inspect?resource_id=${encodeURIComponent(D.site.property)}&id=${encodeURIComponent(u)}`;

function chart(rows, key, color) {
  if (rows.length < 2) return `<p class="muted">The chart appears after two days of data.</p>`;
  const w = 600, h = 140, max = Math.max(...rows.map((r) => r[key]), 1);
  const pts = rows.map((r, i) => `${(i / (rows.length - 1)) * w},${h - (r[key] / max) * (h - 8) - 4}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts}"/></svg><div class="muted">${esc(rows[0].day)} to ${esc(rows.at(-1).day)}, peak ${max}</div>`;
}

function render() {
  const H = D.history, last = H.at(-1), insp = Object.entries(D.inspect);
  const by = {}; insp.forEach(([, v]) => { by[v.coverage || "unknown"] = (by[v.coverage || "unknown"] || 0) + 1; });
  const indexed = by["Submitted and indexed"] || 0;
  const colors = { "Submitted and indexed": "#0a6e3e" };
  const palette = ["#0a6e3e", "#b54708", "#b42318", "#6b7280", "#7c3aed", "#2563eb"];
  const bar = Object.entries(by).map(([k, n], i) => `<i style="width:${(n / Math.max(insp.length, 1)) * 100}%;background:${colors[k] || palette[(i % 5) + 1]}" title="${esc(k)}: ${n}"></i>`).join("");
  const P = D.pipeline;

  $("#app").innerHTML = `
  <h1>${esc(D.site.name)} SEO dashboard</h1>
  <p class="sub">${esc(D.site.url)} · generated ${esc(D.generated)} · data from Search Console, kept in your own repository</p>
  <div class="grid">
    <div class="card"><div class="num">${last ? last.clicks : "–"}</div><div class="lbl">Clicks (28 days)</div></div>
    <div class="card"><div class="num">${last ? last.impressions : "–"}</div><div class="lbl">Impressions (28 days)</div></div>
    <div class="card"><div class="num">${last ? last.position : "–"}</div><div class="lbl">Average position</div></div>
    <div class="card"><div class="num">${indexed} / ${insp.length}</div><div class="lbl">Inspected pages indexed</div></div>
    ${P.tracked ? `<div class="card"><div class="num">${P.upcoming}</div><div class="lbl">Scheduled to publish</div></div><div class="card"><div class="num">${P.queued}</div><div class="lbl">Approved, not yet scheduled</div></div>` : ""}
  </div>

  <h2>Clicks and impressions over time</h2>
  <div class="grid"><div class="card"><div class="lbl">Clicks</div>${chart(H, "clicks", "#0a6e3e")}</div><div class="card"><div class="lbl">Impressions</div>${chart(H, "impressions", "#2563eb")}</div></div>

  <h2>Index status</h2>
  <div class="card"><div class="bar">${bar}</div>${Object.entries(by).map(([k, n]) => `<span class="pill">${esc(k)}: ${n}</span> `).join("")}</div>

  <h2>Pages to request indexing for (do these by hand)</h2>
  ${table(["Page", "Status", "Action"], insp.filter(([, v]) => v.coverage && v.coverage !== "Submitted and indexed" && !/redirect|alternate|duplicate/i.test(v.coverage)).sort((a, b) => (/unknown/i.test(b[1].coverage) ? 1 : 0) - (/unknown/i.test(a[1].coverage) ? 1 : 0)).slice(0, 25).map(([u, v]) => [short(u), esc(v.coverage), `<a target="_blank" rel="noopener" href="${esc(link(u))}">Open in Search Console</a>`]), "Every inspected page is indexed or needs a fix, not a request.")}

  ${P.tracked ? `<h2>Content schedule</h2>${table(["Date", "Page"], P.schedule.slice(0, 40).map((s) => [esc(s.date), s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>` : esc(s.title)]), "Nothing is scheduled. Approve topic proposals to fill the schedule.")}` : ""}

  <h2>Keyword and topic backlog</h2>
  ${table(["Query", "Type", "Impr.", "Position", "Status"], Object.values(D.backlog).sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 40).map((b) => [esc(b.query) + (b.unverified ? ' <span class="pill">idea, no data</span>' : ""), esc((b.kinds || []).join(", ")), b.impressions ?? "", b.position ?? "", esc(b.status)]), "Run the weekly research job to fill this.")}

  <h2>Backlink listings</h2>
  ${table(["Target", "Mode", "Status", "Tries", "Note"], D.backlinks.map((r) => [`<a href="${esc(r.submit_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`, esc(r.mode), `<span class="${r.status === "failed" ? "bad" : r.status === "submitted" || r.status === "done" ? "ok" : "warn"}">${esc(r.status)}</span>`, r.attempts, esc(r.note)]), "No backlink targets configured.")}

  <h2>Latest weekly digest</h2><pre>${esc(D.digest || "The weekly job has not run yet.")}</pre>
  <h2>News and trends</h2><pre>${esc(D.news || "The daily job has not run yet.")}</pre>
  `;
}
render();
</script>
</body>
</html>
